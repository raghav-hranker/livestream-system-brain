<title>Assigned Classes Prototype</title>
<style>

/* overlays */

.copt:hover { background: var(--muted); } .copt.on { background: var(--sel); }
.copt .ct { display: block; font-weight: 600; } .copt .note { display: block; }
.tbl { overflow-x: auto; max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--bar); color: var(--bar-fg); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-fg); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.switcher button { border: 0; background: transparent; color: var(--bar-fg); border-radius: 999px; padding: 6px 10px; cursor: pointer; line-height: 0; }
.switcher button:hover { background: rgba(127, 127, 127, .25); }
.switcher .lbl { font-size: 13px; font-weight: 600; padding-inline: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>

<script>
const RAW = __DATA__;
const READ_ON = '1 Oct 2026';

const I = {
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted-fg)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
const API = {
  topicOrder: 'PUT /api/admin/courses/:courseId/topic-order',
  courseTopics: 'PUT /api/admin/courses/:courseId/topic-priorities   (new)',
  taxonomy: 'PATCH /api/admin/courses/:courseId/placements/:placementId/taxonomy',
  assignment: 'PATCH /api/course-classes/:id',
  copy: 'POST /api/admin/courses/:courseId/copy-to/:targetCourseId   (new)',
};

// ---------- state ----------
let uid = 0; const nid = (p) => p + (++uid);
let course, collapsed, selected, logItems = [], search = '', bTab = null, cTopic = null;
function load() {
  uid = 0;
  course = {
    title: RAW.course,
    targets: RAW.targets.map((x) => Object.assign({}, x, { have: new Set(x.have) })),
    sections: RAW.s.map((s) => ({ id: nid('s'), name: s.n, topics: s.t.map((t) => ({ id: nid('t'), tid: t.id, name: t.n, classes: t.c.map((r) => ({
      id: nid('c'), title: r[0], teacher: r[1], sub: r[2], start: r[3], free: !!r[4], status: r[5] === 1 ? 'active' : 'inactive', listing: !!r[6], live: !!r[7], cid: r[8],
    })) })) })),
  };
  collapsed = new Set(); selected = new Set();
  for (const s of course.sections) for (const t of s.topics) if (t.name !== 'Core Maths') collapsed.add('t:' + t.id);
  const maths = course.sections.find((s) => s.name === 'Maths') || course.sections[0];
  bTab = maths.id;
  cTopic = (maths.topics.find((t) => t.name === 'Core Maths') || maths.topics[0]).id;
}
load();

const allTopics = () => course.sections.flatMap((s) => s.topics);
const topicById = (id) => allTopics().find((t) => t.id === id);
const sectionOf = (t) => course.sections.find((s) => s.topics.includes(t));
const findClass = (id) => { for (const t of allTopics()) { const c = t.classes.find((x) => x.id === id); if (c) return { c, t }; } return {}; };
const secCount = (s) => s.topics.reduce((n, t) => n + t.classes.length, 0);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : (w === 'class' ? 'es' : 's')}`;

// Subtopic groups in first-appearance order (how the website orders its chips).
function buckets(t) {
  if (!t.classes.some((c) => c.sub)) return null;
  const m = new Map();
  for (const c of t.classes) {
    const k = c.sub || '';
    if (!m.has(k)) m.set(k, { key: k, name: c.sub || 'Others', classes: [] });
    m.get(k).classes.push(c);
  }
  return [...m.values()];
}
const flat = (t) => { const b = buckets(t); return b ? b.flatMap((x) => x.classes) : t.classes; };
const move = (arr, from, to) => { const [x] = arr.splice(from, 1); arr.splice(to, 0, x); };
const matches = (c) => !search || c.title.toLowerCase().includes(search) || (c.sub || '').toLowerCase().includes(search);

// ---------- operations (each logs the call the real screen would make) ----------
function save(what, api, effect) { logItems.unshift({ what, api, effect, at: Date.now() }); toast(what); render(); }
function courseOrderEffect(extra) { return `${extra} Saves the order of all ${allTopics().length} topics for this course. The website's section tabs and topic list follow it; no website change.`; }

function reorderRows(t, key, from, to) {
  const b = buckets(t);
  let moved;
  if (!b) { moved = t.classes[from]; move(t.classes, from, to); }
  else { const g = b.find((x) => x.key === key); moved = g.classes[from]; move(g.classes, from, to); t.classes = b.flatMap((x) => x.classes); }
  save(`Moved “${moved.title}” to #${flat(t).indexOf(moved) + 1}`, API.topicOrder,
    `${t.name}: its ${t.classes.length} classes get their own priority numbers back in the new order. No other topic changes.`);
}
function reorderBuckets(t, from, to) {
  const b = buckets(t); const g = b[from]; move(b, from, to); t.classes = b.flatMap((x) => x.classes);
  save(`Moved subtopic “${g.name}” in ${t.name}`, API.topicOrder, `Renumbers ${t.name}'s ${t.classes.length} classes so ${g.name} sits at position ${to + 1}. The website's subtopic chips follow.`);
}
function reorderTopics(s, from, to) {
  const t = s.topics[from]; move(s.topics, from, to);
  save(`Moved topic “${t.name}” within ${s.name}`, API.courseTopics, courseOrderEffect(''));
}
function reorderSections(from, to) {
  const s = course.sections[from]; move(course.sections, from, to);
  save(`Moved section “${s.name}” to position ${to + 1}`, API.courseTopics, courseOrderEffect(`Every topic in ${s.name} now comes before the next section's.`));
}
function arrow(cid, dir) {
  const { c, t } = findClass(cid); const b = buckets(t);
  const list = b ? b.find((x) => x.key === (c.sub || '')).classes : t.classes;
  const i = list.indexOf(c); const j = i + dir; if (j < 0 || j >= list.length) return;
  reorderRows(t, c.sub || '', i, j);
}
function reverseTopic(t) {
  t.classes = flat(t).slice().reverse();
  save(`Reversed priority in ${t.name}`, API.topicOrder, `${t.name}: subtopics and the classes inside each come out in reverse. No other topic changes.`);
}
function reverseAll() {
  for (const t of allTopics()) t.classes = flat(t).slice().reverse();
  save('Reversed priority in every topic', API.topicOrder + '   × ' + allTopics().length, 'One call per topic. Section and topic order stay as they are.');
}
function changeTopic(cid, toTopicId, sub) {
  const { c, t } = findClass(cid); const to = topicById(toTopicId);
  t.classes.splice(t.classes.indexOf(c), 1); c.sub = sub || null; to.classes.push(c);

// ---------- variants + chrome ----------
const VARIANTS = [
  { key: 'a', name: 'One outline', render: renderA },

let vi = Math.max(0, VARIANTS.findIndex((v) => '#' + v.key === location.hash));
let sortables = [];
function render() {

  sortables.forEach((s) => s.destroy()); sortables = [];
  main.innerHTML = VARIANTS[vi].render();
  document.getElementById('vLabel').textContent = `${VARIANTS[vi].key.toUpperCase()} · ${VARIANTS[vi].name}  (${vi + 1}/${VARIANTS.length})`;
  if (q) { const el = document.getElementById('q'); el.focus(); el.setSelectionRange(caret, caret); }

}
function renderLog() {
  const ol = document.getElementById('log');
  ol.innerHTML = logItems.length ? logItems.map((x, i) => `<li>${i === 0 ? '<span class="new">LATEST</span>' : ''}<span class="w">${esc(x.what)}</span><code>${esc(x.api)}</code><span class="e">${esc(x.effect)}</span></li>`).join('')
    : '<li><span class="e">Nothing changed yet. Drag a class, a subtopic, a topic or a section. The call the real screen would make shows up here, with what it changes for students.</span></li>';
}
function wireSortables(root) {
  if (!window.Sortable) {
    if (!document.getElementById('nolib')) root.insertAdjacentHTML('afterbegin', '<p id="nolib" class="note">The drag library did not load. The ▲▼ arrows still work.</p>');
    return;
  }
  const mk = (el, handle, onMove, opts = {}) => sortables.push(Sortable.create(el, Object.assign({
    handle, animation: 150, disabled: !!search, group: { name: 'g' + Math.random(), pull: false, put: false }, fallbackOnBody: true,
    onEnd: (e) => { if (e.oldDraggableIndex !== e.newDraggableIndex) onMove(e.oldDraggableIndex, e.newDraggableIndex); else render(); },
  }, opts)));
  root.querySelectorAll('[data-sort="sections"]').forEach((el) => mk(el, '.g-sec', reorderSections));
  root.querySelectorAll('[data-sort="o-sections"]').forEach((el) => mk(el, '.g-osec', reorderSections));
  root.querySelectorAll('[data-sort="tabs"]').forEach((el) => mk(el, null, reorderSections, { direction: 'horizontal', handle: undefined }));
  root.querySelectorAll('[data-sort="topics"]').forEach((el) => { const s = course.sections.find((x) => x.id === el.dataset.s); mk(el, '.g-top', (a, b) => reorderTopics(s, a, b)); });
  root.querySelectorAll('[data-sort="o-topics"]').forEach((el) => { const s = course.sections.find((x) => x.id === el.dataset.s); mk(el, '.g-otop', (a, b) => reorderTopics(s, a, b)); });
  root.querySelectorAll('[data-sort="buckets"]').forEach((el) => { const t = topicById(el.dataset.t); mk(el, '.g-sub', (a, b) => reorderBuckets(t, a, b)); });
  root.querySelectorAll('[data-sort="o-subs"]').forEach((el) => { const t = topicById(el.dataset.t); mk(el, '.g-osub', (a, b) => reorderBuckets(t, a, b)); });
  root.querySelectorAll('[data-sort="rows"]').forEach((el) => { const t = topicById(el.dataset.t); const key = el.dataset.b; mk(el, '.g-row', (a, b) => reorderRows(t, key, a, b)); });
}
function setVariant(i) { vi = (i + VARIANTS.length) % VARIANTS.length; try { history.replaceState(null, '', '#' + VARIANTS[vi].key); } catch (e) {} closeMenu(); render(); window.scrollTo(0, 0); }
document.getElementById('prevV').onclick = () => setVariant(vi - 1);
document.getElementById('nextV').onclick = () => setVariant(vi + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeMenu(); closeDialog(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') setVariant(vi - 1); if (e.key === 'ArrowRight') setVariant(vi + 1);
});
document.getElementById('clearLog').onclick = () => { logItems = []; renderLog(); };

let toastTimer;
function toast(msg) {

  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(btn, items) {
  closeMenu(); menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.setAttribute('role', 'menu');
  for (const it of items) {
    const b = document.createElement('button'); b.className = 'mi' + (it.disabled ? ' disabled' : ''); b.setAttribute('role', 'menuitem');
    b.append(document.createTextNode(it.label));

    b.onclick = (e) => { e.stopPropagation(); closeMenu(); it.run(); }; menuEl.append(b);

  menuEl.style.top = (r.bottom + window.scrollY + 4) + 'px';

document.addEventListener('click', (e) => { if (menuEl && !menuEl.contains(e.target) && !e.target.closest('[data-act^="menu"]')) closeMenu(); });

// Change topic dialog
let ovEl = null;
function closeDialog() { if (ovEl) { ovEl.remove(); ovEl = null; } }
function openChangeTopic(cid) {
  const { c, t } = findClass(cid); const s0 = sectionOf(t);
  ovEl = document.createElement('div'); ovEl.className = 'ov';
  ovEl.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ctT"><h3 id="ctT">Change topic</h3>
    <div class="note">${esc(c.title)}<br>Currently: ${esc(s0.name)} › ${esc(t.name)}${c.sub ? ' › ' + esc(c.sub) : ''}</div>
    <label>Section<select id="ctS"></select></label><label>Topic<select id="ctTp"></select></label><label>Subtopic<select id="ctSub"></select></label>
    <div class="note">Applies to this course only. The class goes last in its new place.</div>
    <div class="acts"><button class="btn" id="ctCancel">Cancel</button><button class="btn primary" id="ctSave">Save</button></div></div>`;
  document.body.append(ovEl);
  const sS = ovEl.querySelector('#ctS'), sT = ovEl.querySelector('#ctTp'), sB = ovEl.querySelector('#ctSub');
  const opt = (v, l, sel) => { const o = document.createElement('option'); o.value = v; o.textContent = l; o.selected = !!sel; return o; };

  const fillB = (keep) => { sB.innerHTML = ''; sB.append(opt('', 'None')); const x = topicById(sT.value); [...new Set(x.classes.map((k) => k.sub).filter(Boolean))].forEach((n) => sB.append(opt(n, n, keep && n === c.sub))); };
  sS.onchange = () => fillT(false); sT.onchange = () => fillB(false); fillT(true);

// Copy to another course: the same classes get placements there too. Nothing leaves this course.
function openCopy(classes, label) {
  closeDialog(); let pick = null, q = '';
  ovEl = document.createElement('div'); ovEl.className = 'ov'; document.body.append(ovEl);
  ovEl.onclick = (e) => { if (e.target === ovEl) closeDialog(); };
  const step1 = () => {
    const list = course.targets.filter((x) => !q || x.title.toLowerCase().includes(q));
    ovEl.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="cpT"><h3 id="cpT">Copy to another course</h3>
      <div class="note">${plural(classes.length, 'class')} from ${esc(label)}. They stay in ${esc(course.title)} as well.</div>
      <div class="search">${I.search}<input id="cpQ" type="search" placeholder="Search courses" value="${esc(q)}" aria-label="Search courses"></div>
      <div class="clist" role="radiogroup" aria-label="Course">${list.map((x) => `<label class="copt${pick === x ? ' on' : ''}"><input type="radio" name="cp" value="${course.targets.indexOf(x)}" ${pick === x ? 'checked' : ''}>
        <span style="min-width:0"><span class="ct">${esc(x.title)}</span><span class="note">${plural(x.total, 'class')} · ${plural(x.topics, 'topic')}</span></span></label>`).join('') || '<div class="empty">No course matches.</div>'}</div>
      <div class="note">Prototype: only ${course.targets.length} real courses are listed here.</div>
      <div class="acts"><button class="btn" id="cpCancel">Cancel</button><button class="btn primary" id="cpNext" ${pick ? '' : 'disabled'}>Next</button></div></div>`;
    const qi = ovEl.querySelector('#cpQ'); qi.oninput = () => { q = qi.value.trim().toLowerCase(); step1(); const n = ovEl.querySelector('#cpQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    ovEl.querySelectorAll('input[name="cp"]').forEach((r) => { r.onchange = () => { pick = course.targets[+r.value]; step1(); }; });
    ovEl.querySelector('#cpCancel').onclick = closeDialog;
    ovEl.querySelector('#cpNext').onclick = () => pick && step2();
  };
  const step2 = () => {
    const byTopic = new Map();
    for (const c of classes) {
      const t = allTopics().find((x) => x.classes.includes(c));
      if (!byTopic.has(t)) byTopic.set(t, { add: 0, skip: 0 });
      byTopic.get(t)[pick.have.has(c.cid) ? 'skip' : 'add']++;
    }
    const add = [...byTopic.values()].reduce((n, x) => n + x.add, 0), skip = classes.length - add;
    const rows = [...byTopic.entries()].map(([t, x]) => {
      const there = pick.tc[t.tid];
      return `<tr><td>${esc(sectionOf(t).name)} › <b>${esc(t.name)}</b></td><td class="num">${x.add}</td><td class="num">${x.skip}</td>
        <td>${x.add ? (there ? `after its ${there}` : 'new topic, at the end') : '—'}</td></tr>`;
    }).join('');
    ovEl.innerHTML = `<div class="dlg wide" role="dialog" aria-modal="true" aria-labelledby="cpT"><h3 id="cpT">Copy to ${esc(pick.title)}</h3>
      <div><b>${plural(add, 'class')}</b> will be added.${skip ? ` <b>${skip}</b> ${skip === 1 ? 'is' : 'are'} already there and will be skipped.` : ''}</div>
      <div class="tbl"><table class="ptable"><thead><tr><th>Section › Topic</th><th class="num">Add</th><th class="num">Skip</th><th>Lands</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">Same Section › Topic › Subtopic, same order, Is Free, start date and status. Nothing changes in ${esc(course.title)}, and nobody loses access.</div>
      <div class="acts"><button class="btn" id="cpBack">Back</button><button class="btn primary" id="cpGo" ${add ? '' : 'disabled'}>${add ? 'Copy ' + plural(add, 'class') : 'Nothing to copy'}</button></div></div>`;
    ovEl.querySelector('#cpBack').onclick = step1;
    ovEl.querySelector('#cpGo').onclick = () => {
      for (const c of classes) pick.have.add(c.cid);
      for (const [t, x] of byTopic) if (x.add) pick.tc[t.tid] = (pick.tc[t.tid] || 0) + x.add;
      pick.total += add; closeDialog();
      save(`Copied ${plural(add, 'class')} to ${pick.title}${skip ? ` (${skip} skipped)` : ''}`, API.copy,
        `Adds placements in ${pick.title} under the same Section › Topic › Subtopic, in this order, after its own classes in each topic. ${course.title} is unchanged.`);
    };
    ovEl.querySelector('#cpGo').focus();
  };
  step1(); ovEl.querySelector('#cpQ').focus();
}

// one delegated handler for the list
document.getElementById('main').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (a === 'toggle') { const k = el.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); render(); }
  else if (a === 'toggle-all') { const anyOpen = allTopics().some((t) => !collapsed.has('t:' + t.id)); allTopics().forEach((t) => anyOpen ? collapsed.add('t:' + t.id) : collapsed.delete('t:' + t.id)); render(); }
  else if (a === 'up' || a === 'down') arrow(el.dataset.c, a === 'up' ? -1 : 1);
  else if (a === 'status') { const { c } = findClass(el.dataset.c); c.status = c.status === 'active' ? 'inactive' : 'active'; save(`Set “${c.title}” ${c.status}`, API.assignment, 'Unchanged from today.'); }
  else if (a === 'change') openChangeTopic(el.dataset.c);
  else if (a === 'start') toast('Start date & time picker, same as today. End date is gone.');
  else if (a === 'tab') { bTab = el.dataset.s; render(); }
  else if (a === 'pick') { if (e.target.closest('.grip')) return; cTopic = el.dataset.t; render(); }
  else if (a === 'copy-sel') { const ids = selected; openCopy(allTopics().flatMap((t) => flat(t)).filter((c) => ids.has(c.id)), plural(ids.size, 'selected class')); }
  else if (a === 'bulk') toast('Bulk edit keeps Status, Start date and Is Free. No end date, no priority.');
  else if (a === 'remove') toast(`Would remove ${selected.size} classes from this course.`);
  else if (a === 'menu-course') openMenu(el, [
    { label: 'Reverse priority in every topic', hint: 'Section and topic order stay', run: reverseAll },
    { label: 'Copy to another course…', hint: `All ${allTopics().reduce((n, t) => n + t.classes.length, 0)} classes`, run: () => openCopy(allTopics().flatMap((t) => flat(t)), 'the whole course') },
  ]);
  else if (a === 'menu-topic') { const t = topicById(el.dataset.t); const b = buckets(t); openMenu(el, [
    { label: 'Reverse priority', hint: `${t.name} only`, run: () => reverseTopic(t) },
    { label: 'Copy this topic to another course…', hint: plural(t.classes.length, 'class'), run: () => openCopy(flat(t), `${sectionOf(t).name} › ${t.name}`) },
    ...(b ? [{ label: 'Collapse all subtopics', run: () => { b.forEach((g) => collapsed.add('b:' + t.id + ':' + g.key)); collapsed.delete('t:' + t.id); render(); } },
             { label: 'Expand all subtopics', run: () => { b.forEach((g) => collapsed.delete('b:' + t.id + ':' + g.key)); collapsed.delete('t:' + t.id); render(); } }] : []),
  ]); }
  else if (a === 'menu-section') { const s = course.sections.find((x) => x.id === el.dataset.s); openMenu(el, [
    { label: 'Copy this section to another course…', hint: plural(secCount(s), 'class'), run: () => openCopy(s.topics.flatMap((t) => flat(t)), s.name) },
    { label: 'Collapse all topics', run: () => { s.topics.forEach((t) => collapsed.add('t:' + t.id)); render(); } },
    { label: 'Expand all topics', run: () => { s.topics.forEach((t) => collapsed.delete('t:' + t.id)); collapsed.delete('s:' + s.id); render(); } },
  ]); }
});
document.getElementById('main').addEventListener('change', (e) => {
  const el = e.target; const a = el.dataset.act;
  if (a === 'sel') { el.checked ? selected.add(el.dataset.c) : selected.delete(el.dataset.c); render(); }
  else if (a === 'free') { const { c } = findClass(el.dataset.c); c.free = el.checked; save(`Set “${c.title}” ${c.free ? 'free' : 'paid'}`, API.assignment, 'Unchanged from today.'); }
});
document.getElementById('main').addEventListener('input', (e) => { if (e.target.id === 'q') { search = e.target.value.trim().toLowerCase(); render(); } });

document.getElementById('courseTitle').textContent = RAW.course;
document.getElementById('dataNote').textContent = `${RAW.total} classes, read from production on ${READ_ON}. Thumbnails left out.`;
render();
</script>
