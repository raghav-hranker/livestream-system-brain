<title>Certificate design prototype</title>

  .proto { font-size:11px; background:#ffe9a8; color:#5a4500; border-radius:6px; padding:2px 6px; margin-left:8px; vertical-align:middle; }

function wrap(text, max) {
  const lines = [''];
  for (const w of text.split(' ')) {
    const cur = lines[lines.length - 1];
    if ((cur + ' ' + w).trim().length > max && cur) lines.push(w); else lines[lines.length - 1] = (cur + ' ' + w).trim();
  }
  return lines;
}

        <image href="${LOGO}" x="35" y="60" width="160" height="160"/>

        <text x="300" y="130" font-family="Inter" font-weight="600" font-size="15" fill="#a87a1c" letter-spacing="5">CERTIFICATE OF COMPLETION</text>
        <text x="300" y="200" font-family="Inter" font-size="20" fill="#5d6472">This certifies that</text>
        <text x="300" y="285" font-family="${nf}" font-weight="700" font-size="${nameSize(name, 72)}" fill="#111">${esc(name)}</text>
        <text x="300" y="350" font-family="Inter" font-size="20" fill="#5d6472">has completed</text>
        ${lines(course, 44, 300, 395, 40, `font-family="Inter, Noto Sans Devanagari" font-weight="600" font-size="30" fill="#111"`)}
        <line x1="300" y1="${cl > 1 ? 560 : 540}" x2="1060" y2="${cl > 1 ? 560 : 540}" stroke="#e1e3e8" stroke-width="2"/>
        <text x="300" y="610" font-family="Inter" font-size="13" fill="#8a8f99" letter-spacing="2">ISSUED ON</text>
        <text x="300" y="640" font-family="Inter" font-weight="600" font-size="20" fill="#111">${DATE}</text>
        <text x="560" y="610" font-family="Inter" font-size="13" fill="#8a8f99" letter-spacing="2">CERTIFICATE NO.</text>
        <text x="560" y="640" font-family="Inter" font-weight="600" font-size="20" fill="#111">${CODE}</text>
        <text x="820" y="610" font-family="Inter" font-size="13" fill="#8a8f99" letter-spacing="2">SIGNED BY</text>
        <text x="820" y="650" font-family="Great Vibes" font-size="38" fill="#111">${SIGNER}</text>
        <text x="820" y="680" font-family="Inter" font-size="14" fill="#5d6472">${SIGNER_TITLE}</text>
      </svg>`;
    },
  },
};

const keys = Object.keys(variants);
let shown = (() => { const k = new URLSearchParams(location.search).get('variant'); return keys.includes(k) ? k : 'A'; })();
let ni = 0, ci = 0;
function buttons(id, list, get, set) {
  const fs = document.getElementById(id);
  fs.querySelectorAll('button').forEach(b => b.remove());
  list.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.length > 28 ? t.slice(0, 26) + '…' : t;
    b.className = i === get() ? 'on' : '';
    b.onclick = () => { set(i); render(); };
    fs.appendChild(b);
  });
}
function render() {
  const v = variants[shown];
  document.getElementById('label').textContent = `${shown} (${v.name})`;
  document.getElementById('lede').textContent = v.lede;
  document.getElementById('stage').innerHTML = v.draw(NAMES[ni], COURSES[ci]);
  document.getElementById('notes').innerHTML = v.notes.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join('');
  buttons('names', NAMES, () => ni, i => ni = i);
  buttons('courses', COURSES, () => ci, i => ci = i);
}
function go(step) {
  shown = keys[(keys.indexOf(shown) + step + keys.length) % keys.length];
  try { history.replaceState(null, '', '?variant=' + shown); } catch {}
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
document.fonts.ready.then(render);
render();
</script>
</body>
</html>
