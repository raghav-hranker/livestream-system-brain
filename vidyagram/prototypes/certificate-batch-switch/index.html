<!doctype html>
<!--
  PROTOTYPE — throwaway. Task 01 of the Vidyagram certificates plan: where does the admin flip "Batch complete",
  and how does the add-class warning look? Three placements, switchable via ?variant=A|B|C or ← / →.
  Static mock styled after the vidyagram-admin course pages; nothing talks to a backend.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch complete switch prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f8fafc; --ink:#0f172a; --slate:#334155; --muted:#64748b; --line:#e2e8f0; --card:#fff; --primary:#0f172a; --green:#16a34a; --amber-bg:#fffbeb; --amber-line:#fde68a; --amber-ink:#92400e; --gold:#b8892b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 Inter, system-ui, sans-serif; padding:20px 16px 110px; }
  .top { max-width:1100px; margin:0 auto 14px; }
  .top h1 { font-size:18px; margin:0 0 2px; } .top p { margin:0; color:var(--muted); max-width:820px; }
  .proto { font-size:11px; background:#ffe9a8; color:#5a4500; border-radius:6px; padding:2px 6px; margin-left:8px; vertical-align:middle; }
  .page { max-width:1100px; margin:0 auto; }
  .crumb { color:var(--muted); font-size:13px; margin-bottom:4px; } .crumb b { color:var(--ink); font-weight:500; }
  .h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h3 { margin:0 0 14px; font-size:15px; color:#1e293b; }
  .card h4 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:minmax(0, 1fr) 300px; gap:16px; align-items:start; }
  @media (max-width: 820px) { .grid2 { grid-template-columns:1fr; } }
  .field { margin-bottom:12px; } .field label { display:block; font-weight:500; font-size:13px; margin-bottom:4px; }
  .input { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; color:var(--slate); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; padding:8px 14px; font:500 13px Inter, sans-serif; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.full { width:100%; height:42px; }
  .btn.warn { background:#b45309; border-color:#b45309; color:#fff; }
  .sw { position:relative; width:40px; height:22px; border-radius:99px; background:#cbd5e1; border:0; cursor:pointer; flex:none; transition:background .15s; }
  .sw::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition:transform .15s; }
  .sw.on { background:var(--primary); } .sw.on::after { transform:translateX(18px); }
  .row { display:flex; align-items:center; gap:10px; }
  .muted { color:var(--muted); font-size:12.5px; }
  .pill { display:inline-block; border-radius:99px; padding:2px 8px; font-size:11.5px; font-weight:500; border:1px solid; }
  .pill.off { background:#f1f5f9; color:#475569; border-color:#e2e8f0; }
  .pill.on { background:#fef3c7; color:var(--amber-ink); border-color:var(--amber-line); }
  .pill.blue { background:#dbeafe; color:#1e40af; border-color:#bfdbfe; } .pill.red { background:#fee2e2; color:#b91c1c; border-color:#fecaca; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-weight:500; color:var(--muted); padding:10px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:12px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.hl td { background:#fffdf5; }
  .tablewrap { overflow-x:auto; }
  .banner { border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:16px; background:#fff; }
  .banner.on { background:var(--amber-bg); border-color:var(--amber-line); }
  .banner .t { font-weight:600; } .banner .d { color:var(--muted); font-size:12.5px; }
  .banner.on .d { color:var(--amber-ink); }
  .cls { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; gap:8px; }
  .cls:last-child { border-bottom:0; }
  .overlay { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal { background:#fff; border-radius:12px; max-width:440px; width:100%; padding:20px; box-shadow:0 20px 40px rgba(0,0,0,.2); }
  .modal h3 { margin:0 0 8px; font-size:17px; } .modal p { margin:0 0 10px; color:var(--slate); }
  .modal ul { margin:0 0 14px; padding-left:18px; color:var(--slate); }
  .modal .acts { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .state { max-width:1100px; margin:18px auto 0; background:#0f172a; color:#e2e8f0; border-radius:12px; padding:12px 14px; font:12.5px/1.6 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
  .state b { color:#fbbf24; font-weight:500; }
  .log { color:#94a3b8; }
  .switcher { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; background:#111; color:#fff; border-radius:99px; padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.3); font-size:13px; z-index:30; max-width:calc(100% - 32px); }
  .switcher button { background:#2a2a2a; color:#fff; border:0; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; flex:none; }
  .switcher span { padding:0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="top"><h1>Batch complete switch <span class="proto">PROTOTYPE</span></h1><p id="lede"></p></div>
<div class="page" id="page"></div>
<div class="state" id="state"></div>
<div id="modal"></div>
<div class="switcher" role="toolbar" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button>
</div>

<script>
const COURSE = 'SSC CGL 2026 — गणित फाउंडेशन बैच';
const ADMIN = 'Raghav Sharma';
const course = { batchCompleteAt: null, batchCompleteBy: null, notifiedAt: null };
const log = [];
const fmt = d => d ? d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'null';
const on = () => Boolean(course.batchCompleteAt);
const since = () => `since ${course.batchCompleteAt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} by ${course.batchCompleteBy}`;

function modal(html) { document.getElementById('modal').innerHTML = html ? `<div class="overlay"><div class="modal">${html}</div></div>` : ''; }
function askTurnOn() {
  const first = !course.notifiedAt;
  modal(`<h3>Mark this batch complete?</h3>
    <p>Students who bought <b>${COURSE}</b> and are at 100% can then claim a certificate.</p>
    <ul>${first ? '<li>Students already at 100% get one push: "Your certificate is ready".</li>' : '<li>No push this time: students were already notified when the batch was first marked complete.</li>'}
    <li>You can switch it off again. Certificates already issued stay.</li></ul>
    <div class="acts"><button class="btn" onclick="modal('')">Cancel</button><button class="btn primary" onclick="turnOn()">Mark complete</button></div>`);
}
function askTurnOff() {
  modal(`<h3>Reopen this batch?</h3>
    <p>No new certificates can be claimed until you mark it complete again. Certificates already issued stay valid.</p>
    <div class="acts"><button class="btn" onclick="modal('')">Cancel</button><button class="btn primary" onclick="turnOff()">Reopen batch</button></div>`);
}
function turnOn() {
  course.batchCompleteAt = new Date(); course.batchCompleteBy = ADMIN;
  log.push(`PUT /api/admin/courses/:id/batch-complete {complete:true}`);
  if (!course.notifiedAt) { course.notifiedAt = new Date(); log.push('→ push queued to students at 100% (first time only)'); }
  modal(''); render();
}
function turnOff() {
  course.batchCompleteAt = null; course.batchCompleteBy = null;
  log.push(`PUT /api/admin/courses/:id/batch-complete {complete:false}  (notifiedAt kept)`);
  modal(''); render();
}
function toggle() { on() ? askTurnOff() : askTurnOn(); }
function addClass() {
  if (!on()) { log.push('class assigned (batch not complete, no warning)'); render(); return; }
  modal(`<h3>This batch is marked complete</h3>
    <p>Certificates are already being issued for this course. If you add <b>Mensuration Part 20</b>:</p>
    <ul><li>Students who haven't claimed yet will need this class to reach 100%.</li><li>Certificates already issued are not affected.</li></ul>
    <div class="acts"><button class="btn" onclick="modal('')">Cancel</button><button class="btn warn" onclick="log.push('class assigned after warning'); modal(''); render()">Add class anyway</button></div>`);
}

const classesCard = (title = 'Assigned classes') => `<div class="card"><h3>${title}</h3>
  <div class="cls"><span>Mensuration Part 18</span><span class="muted">12 Oct</span></div>
  <div class="cls"><span>Mensuration Part 19</span><span class="muted">14 Oct</span></div>
  <div class="cls"><span>Revision: Mensuration full chapter</span><span class="muted">19 Oct</span></div>
  <div style="margin-top:12px"><button class="btn" onclick="addClass()">+ Assign class</button></div></div>`;

const variants = {
  A: {
    name: 'Card on the course edit page',
    lede: 'A "Certificates" card in the right column of the course edit page, above Actions. The switch saves on its own with a confirm dialog; it is not part of "Save changes". The add-class warning appears on the assign page.',
    page: () => `<div class="crumb">Courses / <b>Edit course</b></div><div class="h1">Edit course</div>
      <div class="grid2"><div style="display:grid;gap:16px">
        <div class="card"><h3>Basic Information</h3>
          <div class="field"><label>Title</label><div class="input">${COURSE}</div></div>
          <div class="field"><label>Short description</label><div class="input">Complete maths foundation for SSC CGL 2026</div></div></div>
        <div class="card"><h3>Settings</h3><div class="row" style="gap:28px;flex-wrap:wrap">
          <div class="field"><label>Priority</label><div class="input">3</div></div>
          <div class="field"><label>Status</label><div class="input">Active</div></div></div></div>
        ${classesCard('Assigned classes (on the Assign Classes page)')}
      </div>
      <aside style="display:grid;gap:16px">
        <div class="card"><h4>Certificates</h4>
          <div class="row" style="justify-content:space-between"><span style="font-weight:500">Batch complete</span><button class="sw ${on() ? 'on' : ''}" onclick="toggle()" aria-label="Batch complete"></button></div>
          <p class="muted" style="margin:8px 0 0">${on() ? `<span class="pill on">Certificates open</span><br>Marked complete ${since()}.` : 'Off. Turn on when every class of this batch has been added. Students at 100% can then claim a certificate.'}</p></div>
        <div class="card"><h4>Actions</h4><button class="btn primary full">Save changes</button></div>
      </aside></div>`,
  },
  B: {
    name: 'Column in the Courses list',
    lede: 'A "Certificates" column in Courses – New, next to Status, using the same row switch. A complete course gets a gold "Batch complete" badge under its title. The add-class warning appears on the assign page.',
    page: () => `<div class="crumb">Admin / <b>Courses – New</b></div><div class="h1">Courses</div>
      <div class="card" style="padding:0"><div class="tablewrap"><table>
        <tr><th>Course</th><th>Type</th><th>Classes</th><th>Status</th><th>Certificates</th></tr>
        <tr class="${on() ? 'hl' : ''}"><td><div style="font-weight:500">${COURSE}</div>${on() ? '<span class="pill on" style="margin-top:4px">Batch complete</span>' : ''}</td>
          <td><span class="pill blue">Paid</span> <span class="pill red">Live</span></td><td>48</td>
          <td><div class="row"><span class="sw on"></span><span style="color:var(--green);font-size:12px;font-weight:500">Active</span></div></td>
          <td><div class="row"><button class="sw ${on() ? 'on' : ''}" onclick="toggle()" aria-label="Batch complete"></button><span class="muted">${on() ? 'Open' : 'Off'}</span></div>${on() ? `<div class="muted" style="margin-top:2px">${since()}</div>` : ''}</td></tr>
        <tr><td><div style="font-weight:500">Bihar Police Constable 2026 Foundation</div></td><td><span class="pill blue">Paid</span> <span class="pill red">Live</span></td><td>112</td>
          <td><div class="row"><span class="sw on"></span><span style="color:var(--green);font-size:12px;font-weight:500">Active</span></div></td><td><div class="row"><span class="sw"></span><span class="muted">Off</span></div></td></tr>
        <tr><td><div style="font-weight:500">Reasoning Crash Course (Recorded)</div></td><td><span class="pill blue">Paid</span></td><td>36</td>
          <td><div class="row"><span class="sw on"></span><span style="color:var(--green);font-size:12px;font-weight:500">Active</span></div></td><td><div class="row"><span class="sw"></span><span class="muted">Off</span></div></td></tr>
      </table></div></div>
      <div style="margin-top:16px">${classesCard('Assign Classes page for the first course')}</div>`,
  },
  C: {
    name: 'Banner on the Assign Classes page',
    lede: 'The switch lives where admins build the batch: a banner at the top of Assign Classes. "Mark batch complete" turns it on; once on, the banner turns amber and stays as a standing reminder while adding classes.',
    page: () => `<div class="crumb">Courses / ${COURSE} / <b>Assign Classes</b></div><div class="h1">Assign Classes</div>
      <div class="banner ${on() ? 'on' : ''}">
        <div><div class="t">${on() ? 'Batch complete — certificates open' : 'Batch in progress'}</div>
        <div class="d">${on() ? `Marked ${since()}. A class added now becomes required for students who haven't claimed.` : 'When every class has been added, mark the batch complete so students at 100% can claim a certificate.'}</div></div>
        <button class="btn ${on() ? '' : 'primary'}" onclick="toggle()">${on() ? 'Reopen batch' : 'Mark batch complete'}</button>
      </div>
      ${classesCard()}`,
  },
};

const keys = Object.keys(variants);
let shown = (() => { const k = new URLSearchParams(location.search).get('variant'); return keys.includes(k) ? k : 'A'; })();
function render() {
  const v = variants[shown];
  document.getElementById('label').textContent = `${shown} (${v.name})`;
  document.getElementById('lede').textContent = v.lede;
  document.getElementById('page').innerHTML = v.page();
  document.getElementById('state').innerHTML = `<b>course.certificate</b> = { batchCompleteAt: ${fmt(course.batchCompleteAt)}, batchCompleteBy: ${course.batchCompleteBy ?? 'null'}, notifiedAt: ${fmt(course.notifiedAt)} }\n` +
    (log.length ? log.map(l => `<span class="log">${l}</span>`).join('\n') : '<span class="log">Try: flip the switch on, add a class, switch it off, switch it on again (no second push).</span>');
}
function go(step) {
  shown = keys[(keys.indexOf(shown) + step + keys.length) % keys.length];
  try { history.replaceState(null, '', '?variant=' + shown); } catch {}
  modal(''); render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'Escape') modal('');
});
render();
</script>
</body>
</html>
