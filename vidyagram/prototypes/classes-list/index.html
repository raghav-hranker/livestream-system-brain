}
const pill = c => { const s = state(c); return `<span class="pill ${s.k}"><span class="dot"></span>${esc(s.label)}</span>`; };
const thumb = (c, cls = 'thumb') => `<span class="${cls}" style="background:linear-gradient(135deg,hsl(${c.hue} 60% 38%),hsl(${(c.hue + 40) % 360} 55% 28%))">${esc(c.section.slice(0, 3).toUpperCase())}</span>`;
const sw = c => `<button class="switch" role="switch" aria-checked="${c.active}" aria-label="Active" data-toggle="${c.id}"></button>`;
const metaLine = c => `${esc(c.section)} › ${esc(c.topic)} · ${esc(c.faculty)} · ${when(c)}`;

// The one action a row needs right now; everything else lives in the ⋯ menu.
function primary(c, size = 'sm') {
  const s = state(c).k;
  if (s === 'live') return `<button class="btn ${size} live-o" data-act="open-live" data-id="${c.id}">${I('radio', 14)} Open live</button>`;
  if (s === 'sched') return `<button class="btn ${size} live" data-act="go-live" data-id="${c.id}">${I('radio', 14)} Go Live</button>`;
  if (s === 'novideo') return `<button class="btn ${size} primary" data-act="upload" data-id="${c.id}">${I('upload', 14)} Upload video</button>`;
  return `<button class="btn ${size}" data-act="edit" data-id="${c.id}">${I('edit', 14)} Edit</button>`;
}

const S = { v: 'a', q: '', fState: '', fAccess: '', fSection: '', sel: new Set(), focus: 3, tab: 'needs' };
const VARIANTS = {
  a: { name: 'Compact table', why: '<b>A · Compact table.</b> Same table, one line per class. Free / Live / Status fold into one state pill; the 3 Assign buttons become clickable counts (PDF · Test · Course); the 4 action buttons become the one action that row needs plus a ⋯ menu. About 12 rows fit where 3 fit today.' },
  b: { name: 'List + detail panel', why: '<b>B · List + detail panel.</b> The list carries no buttons at all, only what you scan by. Click a class and everything you can do to it opens on the right: video, attached PDFs / tests / courses, active switch, edit and duplicate.' },
  c: { name: 'Work queues', why: '<b>C · Work queues.</b> Tabs sort classes by what they need: a video, going live, or nothing. Rows sit under their day with the time on the left, and each tab shows only the button that clears the queue.' },
};
const ORDER = ['a', 'b', 'c'];

function filtered() {
  const q = S.q.trim().toLowerCase();
  return CLASSES.filter(c =>
    (!q || c.title.toLowerCase().includes(q) || c.faculty.toLowerCase().includes(q)) &&
    (!S.fState || state(c).k === S.fState) &&
    (!S.fAccess || (S.fAccess === 'free') === c.free) &&
    (!S.fSection || c.section === S.fSection));
}
const sections = [...new Set(CLASSES.map(c => c.section))].sort();
const opt = (v, l, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`;
const searchBox = () => `<label class="search">${I('search')}<input type="search" id="q" placeholder="Search by title or faculty…" value="${esc(S.q)}" aria-label="Search classes"></label>`;
const addBtns = () => `<span class="grow"></span><button class="btn" data-act="bulk-upload">${I('upload', 14)} Bulk upload videos</button><button class="btn primary" data-act="add">${I('plus', 14)} Add class</button>`;
const sectionSel = () => `<select id="fSection" aria-label="Section">${opt('', 'All sections', S.fSection)}${sections.map(s => opt(s, s, S.fSection)).join('')}</select>`;
const accessSel = () => `<select id="fAccess" aria-label="Access">${opt('', 'Free + paid', S.fAccess)}${opt('free', 'Free', S.fAccess)}${opt('paid', 'Paid', S.fAccess)}</select>`;
function bulkBar() {
  if (!S.sel.size) return '';
  return `<div class="bulk">${S.sel.size} selected<span class="grow"></span>
    <button class="btn sm" data-act="bulk-section">Change section / topic</button>
    <button class="btn sm" data-act="bulk-courses">${I('book', 14)} Add to courses</button>
    <button class="btn sm" data-act="bulk-inactive">Set inactive</button>
    <button class="btn sm ghost" data-act="clear-sel">Clear</button></div>`;
}
const attCounts = c => `<div class="att">
  <button class="${c.pdfs ? '' : 'zero'}" data-act="pdfs" data-id="${c.id}" title="Assign PDFs">${I('file', 13)} ${c.pdfs}</button>
  <button class="${c.tests ? '' : 'zero'}" data-act="tests" data-id="${c.id}" title="Assign tests">${I('test', 13)} ${c.tests}</button>
  <button class="${c.courses ? '' : 'zero'}" data-act="courses" data-id="${c.id}" title="Assign to courses">${I('book', 13)} ${c.courses}</button></div>`;

/* ---------- A: compact table ---------- */
function shellA() {
  return `<div class="toolbar">${searchBox()}
    <select id="fState" aria-label="State">${opt('', 'All states', S.fState)}${opt('live', 'Live now', S.fState)}${opt('sched', 'Scheduled', S.fState)}${opt('novideo', 'Needs video', S.fState)}${opt('ready', 'Has video', S.fState)}</select>
    ${accessSel()}${sectionSel()}${addBtns()}</div><div id="bulk"></div>
    <div class="tablewrap"><table class="tbl"><thead><tr>
      <th class="w-cb"><input type="checkbox" id="all" aria-label="Select all"></th><th class="w-cls">Class</th><th>State</th><th>Access</th><th>PDFs · Tests · Courses</th><th>Active</th><th></th>
    </tr></thead><tbody id="body"></tbody></table></div>`;
}
function bodyA() {
  const rows = filtered();
  document.getElementById('bulk').innerHTML = bulkBar();
  document.getElementById('body').innerHTML = rows.length ? rows.map(c => `
    <tr class="${c.active ? '' : 'off'} ${S.sel.has(c.id) ? 'picked' : ''}">
      <td><input type="checkbox" data-sel="${c.id}" ${S.sel.has(c.id) ? 'checked' : ''} aria-label="Select ${esc(c.title)}"></td>
      <td><div class="cls">${thumb(c)}<div class="min0"><div class="t">${esc(c.title)}</div><div class="meta">${metaLine(c)}</div></div></div></td>
      <td>${pill(c)}</td>
      <td>${c.free ? '<span class="tag">Free</span>' : '<span class="muted small">Paid</span>'}</td>
      <td>${attCounts(c)}</td>
      <td>${sw(c)}</td>
      <td class="act">${primary(c)}<button class="icon-btn" data-menu="${c.id}" aria-label="More actions">${I('more')}</button></td>
    </tr>`).join('') : `<tr><td colspan="7" class="empty">No classes match.</td></tr>`;
}

/* ---------- B: list + detail panel ---------- */
function shellB() {
  return `<div class="toolbar">${searchBox()}${accessSel()}${sectionSel()}${addBtns()}</div>
    <div class="split"><div class="card list" id="body"></div><aside class="card panel" id="panel" aria-live="polite"></aside></div>`;
}
function bodyB() {
  const rows = filtered();
  if (rows.length && !rows.some(c => c.id === S.focus)) S.focus = rows[0].id;
  document.getElementById('body').innerHTML = rows.length ? rows.map(c => `
    <button class="li ${c.active ? '' : 'off'}" data-focus="${c.id}" aria-current="${c.id === S.focus}">
      ${thumb(c)}<div class="min0"><div class="t">${esc(c.title)}</div><div class="meta">${esc(c.section)} › ${esc(c.topic)} · ${when(c)}</div></div>
      ${c.active ? '' : '<span class="muted small">Inactive</span>'}${pill(c)}
    </button>`).join('') : `<div class="empty">No classes match.</div>`;
  const c = CLASSES.find(x => x.id === S.focus);
  const panel = document.getElementById('panel');
  if (!c || !rows.length) { panel.innerHTML = '<div class="empty">Pick a class.</div>'; return; }
  const s = state(c).k;
  const videoText = { live: 'Streaming now. Students see it in their live schedule.', sched: `Goes live ${when(c)}.`, ready: c.stream === 'ended' ? 'The live recording is published.' : 'Uploaded video is published.', novideo: c.stream === 'ended' ? 'The class ended without a recording. Upload the video so students can watch it.' : 'No video yet. Upload one or go live.' }[s];
  const videoBtns = {
    live: `<button class="btn live-o" data-act="open-live" data-id="${c.id}">${I('radio', 14)} Open live</button>`,
    sched: `<button class="btn live" data-act="go-live" data-id="${c.id}">${I('radio', 14)} Go Live</button><button class="btn" data-act="upload" data-id="${c.id}">${I('upload', 14)} Upload instead</button>`,
    ready: `<button class="btn" data-act="watch" data-id="${c.id}">${I('play', 14)} Preview</button><button class="btn" data-act="upload" data-id="${c.id}">${I('upload', 14)} Replace video</button><button class="btn ghost" data-act="go-live" data-id="${c.id}">Go live again</button>`,
    novideo: `<button class="btn primary" data-act="upload" data-id="${c.id}">${I('upload', 14)} Upload video</button><button class="btn live-o" data-act="go-live" data-id="${c.id}">${I('radio', 14)} Go Live</button>`,
  }[s];
  const att = (icon, label, n, act, unit) => `<div class="kv"><span class="k">${I(icon, 15)} ${label}</span>
    <span class="row"><span class="${n ? '' : 'faint'} small">${n ? `${n} ${unit}${n > 1 ? 's' : ''}` : 'None'}</span><button class="btn sm" data-act="${act}" data-id="${c.id}">${n ? 'Manage' : 'Add'}</button></span></div>`;
  panel.innerHTML = `
    <div style="background:linear-gradient(135deg,hsl(${c.hue} 60% 38%),hsl(${(c.hue + 40) % 360} 55% 28%))" class="hero">${esc(c.section.toUpperCase())}</div>
    <div><h2>${esc(c.title)}</h2><div class="muted small" style="margin-top:4px">${metaLine(c)}</div>
      <div class="row" style="margin-top:8px">${pill(c)}${c.free ? '<span class="tag">Free</span>' : '<span class="muted small">Paid</span>'}</div></div>
    <div class="kv" style="border:0;padding:0"><span class="k">${sw(c)} <span>${c.active ? 'Active — visible to students' : 'Inactive — hidden from students'}</span></span></div>
    <div class="sec"><h3>Video</h3><div class="videobox"><div class="small">${videoText}</div><div class="row">${videoBtns}</div></div></div>
    <div class="sec"><h3>Attached</h3>${att('file', 'PDFs', c.pdfs, 'pdfs', 'PDF')}${att('test', 'Tests', c.tests, 'tests', 'test')}${att('book', 'Courses', c.courses, 'courses', 'course')}</div>
    <div class="row"><button class="btn" data-act="edit" data-id="${c.id}">${I('edit', 14)} Edit details</button><button class="btn" data-act="duplicate" data-id="${c.id}">${I('copy', 14)} Duplicate</button></div>`;
}

/* ---------- C: work queues ---------- */
const QUEUES = [
  { k: 'needs', label: 'Needs video', test: c => c.active && state(c).k === 'novideo' },
  { k: 'upcoming', label: 'Live & upcoming', test: c => c.active && ['live', 'sched'].includes(state(c).k), hot: true },
  { k: 'ready', label: 'Published', test: c => c.active && state(c).k === 'ready' },
  { k: 'inactive', label: 'Inactive', test: c => !c.active },
  { k: 'all', label: 'All', test: () => true },
];
function shellC() {
  return `<div class="toolbar">${searchBox()}${sectionSel()}${addBtns()}</div>
    <div class="tabs" role="tablist" id="tabs"></div><div id="bulk"></div><div id="body"></div>`;
}
function bodyC() {
  const base = filtered();
  document.getElementById('tabs').innerHTML = QUEUES.map(q => {
    const n = base.filter(q.test).length;
    return `<button class="tab ${q.hot && n ? 'hot' : ''}" role="tab" aria-selected="${S.tab === q.k}" data-tab="${q.k}">${q.label}<span class="count">${n}</span></button>`;
  }).join('');
  document.getElementById('bulk').innerHTML = bulkBar();
  const qd = QUEUES.find(q => q.k === S.tab);
  const rows = base.filter(qd.test).sort((a, b) => S.tab === 'upcoming' ? a.at.localeCompare(b.at) : b.at.localeCompare(a.at));
  if (!rows.length) { document.getElementById('body').innerHTML = `<div class="card empty">Nothing here. ${S.tab === 'needs' ? 'Every active class has a video.' : ''}</div>`; return; }
  const groups = [];
  rows.forEach(c => { const k = dayKey(c); const g = groups.at(-1); g && g.k === k ? g.rows.push(c) : groups.push({ k, rows: [c] }); });
  document.getElementById('body').innerHTML = groups.map(g => `
    <div class="day">${dayLabel(g.k)} · ${g.rows.length} ${g.rows.length > 1 ? 'classes' : 'class'}</div>
    <div class="card">${g.rows.map(c => {
      const att = [c.pdfs && `${c.pdfs} PDF${c.pdfs > 1 ? 's' : ''}`, c.tests && `${c.tests} test${c.tests > 1 ? 's' : ''}`, c.courses && `${c.courses} course${c.courses > 1 ? 's' : ''}`].filter(Boolean).join(' · ') || 'Not in any course';
      return `<div class="q ${c.active ? '' : 'off'} ${S.sel.has(c.id) ? 'picked' : ''}">
        <input type="checkbox" data-sel="${c.id}" ${S.sel.has(c.id) ? 'checked' : ''} aria-label="Select ${esc(c.title)}">
        <div class="time">${clock(c)}<small>${S.tab === 'all' || S.tab === 'inactive' ? state(c).label : (c.free ? 'Free' : 'Paid')}</small></div>
        <div class="cls">${thumb(c)}<div class="min0"><div class="t">${esc(c.title)}</div><div class="meta">${esc(c.section)} › ${esc(c.topic)} · ${esc(c.faculty)}</div></div></div>
        <div class="qatt small ${c.courses ? 'muted' : ''}" style="${c.courses ? '' : 'color:var(--warn-ink)'}">${att}</div>
        <div class="act" style="white-space:nowrap">${S.tab === 'inactive' ? `<button class="btn sm" data-toggle="${c.id}">Set active</button>` : primary(c)}<button class="icon-btn" data-menu="${c.id}" aria-label="More actions">${I('more')}</button></div>
      </div>`; }).join('')}</div>`).join('');
}

/* ---------- wiring ---------- */
const SHELL = { a: shellA, b: shellB, c: shellC }, BODY = { a: bodyA, b: bodyB, c: bodyC };
function mount() {
  document.getElementById('why').innerHTML = VARIANTS[S.v].why;
  document.getElementById('vlabel').textContent = `${S.v.toUpperCase()} · ${VARIANTS[S.v].name}`;
  document.getElementById('app').innerHTML = SHELL[S.v]();
  BODY[S.v]();
}
const refresh = () => BODY[S.v]();
function go(v) { S.v = v; closeMenu(); try { history.replaceState(null, '', '#' + v); } catch (e) {} mount(); }
function step(d) { go(ORDER[(ORDER.indexOf(S.v) + d + ORDER.length) % ORDER.length]); }

const ACT_LABEL = { 'open-live': 'Open the live control room', 'go-live': 'Open Go Live (stream key + OBS link)', upload: 'Open the Upload Video dialog', edit: 'Open the Edit class dialog', duplicate: 'Open Duplicate class', pdfs: 'Open Assign PDFs', tests: 'Open Assign Tests', courses: 'Open Assign to Courses', watch: 'Play the class video', add: 'Open Add class', 'bulk-upload': 'Open Bulk upload videos', 'bulk-section': 'Open Change section / topic / subtopic', 'bulk-courses': 'Open Add to courses for the selection' };
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2200); }

const menu = document.getElementById('menu');
function closeMenu() { menu.hidden = true; }
function openMenu(btn, id) {
  const c = CLASSES.find(x => x.id === id);
  menu.innerHTML = `
    <button data-act="edit" data-id="${id}">${I('edit', 15)} Edit</button>
    <button data-act="duplicate" data-id="${id}">${I('copy', 15)} Duplicate</button><hr>
    <button data-act="upload" data-id="${id}">${I('video', 15)} ${c.video ? 'Replace video' : 'Upload video'}</button>
    <button data-act="go-live" data-id="${id}">${I('radio', 15)} Go Live</button><hr>
    <button data-act="pdfs" data-id="${id}">${I('file', 15)} Assign PDFs</button>
    <button data-act="tests" data-id="${id}">${I('test', 15)} Assign tests</button>
    <button data-act="courses" data-id="${id}">${I('book', 15)} Assign to courses</button>`;
  menu.hidden = false;
  const r = btn.getBoundingClientRect(), mh = menu.offsetHeight, mw = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.right - mw, innerWidth - mw - 8)) + 'px';
  menu.style.top = (r.bottom + mh + 8 > innerHeight ? r.top - mh - 4 : r.bottom + 4) + 'px';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-menu],[data-act],[data-toggle],[data-focus],[data-tab],[data-sel],#all');
  if (!t || !t.matches('[data-menu]')) closeMenu();
  if (!t) return;
  if (t.matches('[data-menu]')) { e.stopPropagation(); const id = +t.dataset.menu; menu.hidden ? openMenu(t, id) : closeMenu(); return; }
  if (t.matches('[data-toggle]')) { const c = CLASSES.find(x => x.id === +t.dataset.toggle); c.active = !c.active; toast(`${c.title}: ${c.active ? 'active' : 'inactive'}`); return refresh(); }
  if (t.matches('[data-focus]')) { S.focus = +t.dataset.focus; return refresh(); }
  if (t.matches('[data-tab]')) { S.tab = t.dataset.tab; S.sel.clear(); return refresh(); }
  if (t.matches('[data-sel]')) { const id = +t.dataset.sel; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); return refresh(); }
  if (t.id === 'all') { const ids = filtered().map(c => c.id); t.checked ? ids.forEach(i => S.sel.add(i)) : S.sel.clear(); return refresh(); }
  const a = t.dataset.act;
  if (a === 'clear-sel') { S.sel.clear(); const all = document.getElementById('all'); if (all) all.checked = false; return refresh(); }
  if (a === 'bulk-inactive') { CLASSES.forEach(c => S.sel.has(c.id) && (c.active = false)); toast(`${S.sel.size} classes set inactive`); S.sel.clear(); return refresh(); }
  const c = CLASSES.find(x => x.id === +t.dataset.id);
  toast(`Prototype: would ${(ACT_LABEL[a] || a).replace(/^Open/, 'open').replace(/^Play/, 'play')}${c ? ` for “${c.title}”` : ''}`);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; refresh(); }
});
document.addEventListener('change', e => {
  if (['fState', 'fAccess', 'fSection'].includes(e.target.id)) { S[e.target.id] = e.target.value; refresh(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
addEventListener('scroll', closeMenu, true);
document.getElementById('prev').innerHTML = I('chevL', 18);
document.getElementById('next').innerHTML = I('chevR', 18);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);

const h = (location.hash || '').slice(1).toLowerCase();
S.v = ORDER.includes(h) ? h : 'a';
mount();
</script>
