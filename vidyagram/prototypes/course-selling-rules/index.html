<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Selling Rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the admin course form on the left, the student's screens and the plan writes on the right, so every rule shows its result at once. */
:root{
  --bg:#f3f5f9; --surface:#fff; --sunk:#edf0f5; --hover:#f6f8fb;
  --ink:#141b2b; --muted:#566076; --faint:#8891a5;
  --line:#dfe3ec; --line-strong:#c6ccda;
  --accent:#2457d6; --accent-ink:#fff; --accent-soft:#e7eefd; --accent-line:#a9c1f5;
  --cta:#0c0f16; --cta-ink:#fff;
  --ok:#0f7a4f; --ok-soft:#e1f4ea;
  --warn:#955a00; --warn-soft:#fcf2dd; --warn-line:#ebcd92;
  --app:#7a3fb8; --app-soft:#f2e9fb;
  --bad:#b42318;
  --shadow:0 1px 2px rgba(15,25,50,.06),0 6px 18px rgba(15,25,50,.07);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --surface:#161b25; --sunk:#10141c; --hover:#1c2230;
  --ink:#e6eaf3; --muted:#9ca6ba; --faint:#6f7a8f;
  --line:#262d3b; --line-strong:#394254;
  --accent:#7ea2f7; --accent-ink:#0b1222; --accent-soft:#18233d; --accent-line:#2d4479;
  --cta:#e6eaf3; --cta-ink:#0e1219;
  --ok:#5ed39f; --ok-soft:#10291e;
  --warn:#efb65c; --warn-soft:#2f2410; --warn-line:#67501f;
  --app:#c49bf0; --app-soft:#261a36;
  --bad:#ff8c7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --surface:#161b25; --sunk:#10141c; --hover:#1c2230;
  --ink:#e6eaf3; --muted:#9ca6ba; --faint:#6f7a8f;
  --line:#262d3b; --line-strong:#394254;
  --accent:#7ea2f7; --accent-ink:#0b1222; --accent-soft:#18233d; --accent-line:#2d4479;
  --cta:#e6eaf3; --cta-ink:#0e1219;
  --ok:#5ed39f; --ok-soft:#10291e;
  --warn:#efb65c; --warn-soft:#2f2410; --warn-line:#67501f;
  --app:#c49bf0; --app-soft:#261a36;
  --bad:#ff8c7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar h1{font-size:15px;font-weight:700;margin:0}
.seg{display:flex;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sample{flex:1;font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:92px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);resize:vertical}
.steps button{border:0;background:none;padding:0;color:inherit;font-weight:inherit;display:inline-flex;align-items:center}
.steps button:disabled{cursor:not-allowed;opacity:.55}
.steps span.done b{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.stepline{flex:0 0 28px;height:1px;background:var(--line-strong)}
.top{position:sticky;top:0;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.top h2{font-size:18px;font-weight:700;margin:0;text-wrap:balance;min-width:0}
.err{color:var(--bad);font-size:12.5px}
.req::after{content:" *";color:var(--bad)}
.upload{display:flex;flex-direction:column;gap:8px}
.ban{min-height:96px;border-radius:10px;background:linear-gradient(120deg,#25306b,#8a2b6d);color:#fff;font-weight:700;padding:12px;display:flex;align-items:flex-end;line-height:1.2}
.ban.none{background:var(--sunk);color:var(--muted);font-weight:500;align-items:center;justify-content:center;border:1px dashed var(--line-strong)}
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 30px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.flags{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.flag{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.check b{width:18px;flex:none;text-align:center}
.check .ok{color:var(--ok)}.check .warn{color:var(--warn)}.check .bad{color:var(--bad)}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat div{background:var(--sunk);border-radius:6px;padding:9px 11px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);z-index:9;max-width:90vw}
.idea{background:var(--accent-soft);border-bottom:1px solid var(--accent-line);padding:9px 20px;font-size:13px}
.idea b{font-weight:600}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px 20px;align-items:start;max-width:1440px;margin:0 auto}
main,aside{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h3{font-size:15px;font-weight:600;margin:0}
.card .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.head h2{font-size:18px;font-weight:700;margin:0;text-wrap:balance}
label{display:block;font-weight:500;font-size:13px}
input[type=text],select{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums;max-width:100%}
input[type=text]{width:100%}
input:disabled,select:disabled{background:var(--sunk);color:var(--faint)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.pair{display:flex}
.pair input{border-radius:6px 0 0 6px;border-right:0;width:64px;flex:none}
.pair select{border-radius:0 6px 6px 0;flex:1;min-width:0}
.body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.say{padding:9px 12px;border-radius:6px;background:var(--sunk);font-weight:500;font-size:13.5px}
.note{padding:9px 12px;border-radius:6px;font-size:13px;border:1px solid var(--warn-line);background:var(--warn-soft)}
.note b{font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:500;background:none;border:0;padding:0}
.switch i{width:36px;height:20px;border-radius:10px;background:var(--line-strong);position:relative;display:inline-block;flex:none}
.switch i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .12s}
.switch.on i{background:var(--accent)}
.switch.on i::after{left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--line-strong);border-radius:14px;font-size:13px;max-width:100%}
.chip button{border:0;background:var(--sunk);border-radius:50%;width:20px;height:20px;line-height:18px;padding:0;color:var(--muted);flex:none}
.pick{width:210px}
.steps{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-weight:500;padding:2px 0}
.steps b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);margin-right:6px;font-size:12px;font-weight:600}
.steps span.on{color:var(--ink);font-weight:600}
.steps span.on b{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.radio{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:400;min-height:36px}
.radio input{margin:0;accent-color:var(--accent)}
.sect{font-weight:600;font-size:13px;margin:0 0 2px}
.indent{display:flex;flex-direction:column;gap:2px}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 30px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.lenrow{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,1fr) 30px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 180px 30px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.x{border:0;background:var(--sunk);border-radius:50%;width:24px;height:24px;line-height:22px;padding:0;color:var(--muted)}
.btn{height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link{color:var(--accent);font-weight:500;text-decoration:underline;background:none;border:0;padding:0;text-align:left}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
tr.open td{background:var(--accent-soft)}
tr.off td{color:var(--faint)}
.kind{font-weight:600}
.map{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1.1fr) 34px minmax(0,1fr);gap:6px;align-items:center;margin-top:14px}
.col{display:flex;flex-direction:column;gap:8px}
.coltitle{font-size:12px;font-weight:600;color:var(--muted)}
.node{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:9px 11px;text-align:left;width:100%}
.node b{display:block;font-weight:600}
.node span{display:block;font-size:12.5px;color:var(--muted)}
.node.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.node.off{border-style:dashed;color:var(--faint)}
.node.mid{padding:14px}
.arrow{text-align:center;color:var(--faint);font-size:18px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.who{width:100%}
.stu{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.stu h4{font-size:15px;font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
.price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.price s{font-size:14px;font-weight:400;color:var(--faint)}
.off-pill{font-size:12px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok)}
.meta{font-size:12.5px;color:var(--muted)}
.cta{display:block;width:100%;height:38px;border:0;border-radius:8px;background:var(--cta);color:var(--cta-ink);font-weight:600;text-align:center;line-height:38px;font-size:14px}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.cta.dis{background:var(--sunk);color:var(--muted)}
.minis{display:flex;flex-direction:column;gap:6px}
.mini{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.mini span{min-width:0}
.mini em{font-style:normal;font-weight:600;color:var(--accent);white-space:nowrap}
.tabline{font-size:12.5px;font-weight:600;border-bottom:2px solid var(--ink);display:inline-block;padding-bottom:3px}
.writes{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pl{border-left:3px solid var(--line-strong);padding-left:9px}
.pl>b{font-weight:600;font-size:13px}
.ln{display:flex;gap:6px;align-items:baseline;margin-top:3px}
.ln code{font:400 11.5px/1.4 var(--f-mono);color:var(--muted);overflow-wrap:anywhere;min-width:0}
.tag{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:4px;flex:none;line-height:16px}
.tag.live{background:var(--ok-soft);color:var(--ok)}
.tag.new{background:var(--warn-soft);color:var(--warn)}
.tag.app{background:var(--app-soft);color:var(--app)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted);align-items:center}
.small{font-size:12.5px;color:var(--muted)}
.out{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:7px 0}
@media (max-width:1040px){.shell{grid-template-columns:minmax(0,1fr)}.sample{margin-left:0}}
@media (max-width:680px){.map{grid-template-columns:minmax(0,1fr)}.arrow{display:none}.addrow{grid-template-columns:minmax(0,1fr) 90px 30px}.addrow .pair{grid-column:1 / -1;grid-row:2}.shell{padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">

</div>
<script>
const CAT={

const TESTS={t1:'UPSSSC Mock Test Series',t2:'SSC CGL Tier 1 Test Pass'};

const DEF={win:30,days:183,dayText:'6 Months',pct:50,min:125};
const V=(n,u)=>({n,u});
const blank=(price,v,mrp)=>({
  base:{price,mrp,v,multi:false,more:[]},
  info:{title:'',short:'',desc:'',tags:[],main:'',cat:'',faculty:[],doubt:'',web:false,app:false},
  content:{classes:0,tests:0,pdfs:0,highlights:[],timetable:false,schedule:[],faqs:[]},
  settings:{status:'active',closed:false,free:false,priority:1,live:false,rec:true,inNew:false,old:false},
  saved:true,

  ext:{on:true,win:{m:'def',n:30},dur:{m:'def',v:V(6,'Months')},pr:{m:'def',kind:'fixed',val:300},min:{m:'def',val:125}},
  upg:{on:false,sources:[],price:500,v:V(2,'Years'),over:{}},

  exch:{on:false,targets:[],mode:'swap',price:899,v:V(2,'Years')},
});
const seed=()=>{
  const c={
    cgl:blank(999,V(3,'Years'),1999),
    upsssc:blank(799,V(2,'Years'),1999),
    upgkc:blank(399,V(1,'Years'),1999),

  const fill=(id,info,content,settings)=>{Object.assign(c[id].info,{web:true,app:true},info);Object.assign(c[id].content,content);Object.assign(c[id].settings,settings)};
  fill('cgl',{title:'SSC CGL Foundation 2027',short:'Complete foundation for SSC CGL Tier 1 and Tier 2.',desc:'Live classes with recordings, class notes and topic tests for every subject.',tags:['SSC','CGL'],main:'SSC',cat:'SSC CGL',faculty:['Aditya Ranjan Sir','Jai Sir']},{classes:120,tests:24,pdfs:96,highlights:[{title:'Bilingual classes',content:'Hindi and English'},{title:'Hand written notes',content:'For every class'}],timetable:true,schedule:[{topic:'Maths',time:'8:00 AM'},{topic:'English',time:'10:00 AM'}]},{live:true,rec:true,inNew:true});
  fill('champ',{title:'Champions 5.0 Maths Special',short:'Arithmetic and Advance, Pre and Mains, for all exams.',desc:'Live batch by Aditya Sir, starting 01 Oct 2026.',tags:['Maths'],main:'Maths',cat:'All exams',faculty:['Aditya Ranjan Sir'],doubt:'https://t.me/champions5'},{classes:86,tests:12,pdfs:60},{live:true,rec:true});

  fill('upgkc',{title:'UPGK + Computer Combo Batch',short:'UPGK and Computer together for UPSSSC exams.',desc:'Both batches at one price.',tags:['UPSSSC','Combo'],main:'UP Exams',cat:'UPSSSC',faculty:['Vk Sir',"Riya Ma'am"],web:false,app:false},{},{status:'draft'});
  fill('vod',{title:'Maths VOD Batch by Aditya Ranjan Sir',short:'Arithmetic and Advance, Pre to Mains, for all Govt exams.',desc:'Recorded batch.',tags:['Maths','VOD'],main:'Maths',cat:'All exams',faculty:['Aditya Ranjan Sir']},{classes:400,tests:30,pdfs:300},{});
  c.fresh.saved=false;c.fresh.settings.status='draft';c.fresh.settings.priority=1;

  Object.assign(c.cgl.upg,{on:true,sources:['mathsM','engM'],price:500,v:V(2,'Years'),over:{engM:400}});
  Object.assign(c.cgl.add,{on:true,rows:[{src:'vod',price:200,v:V(2,'Years')}]});
  Object.assign(c.cgl.exch,{on:true,targets:['reas','gs'],mode:'swap',price:899,v:V(2,'Years')});
  c.cgl.incl.tests=['t2'];
  Object.assign(c.upsssc.incl,{combo:true,subs:['roaro','vpo','ja']});
  Object.assign(c.upgkc.incl,{combo:true,subs:['upgk','comp']});
  return c;
};
const EDITABLE=['cgl','champ','upsssc','upgkc','vod'];
const SAMPLES=['fresh',...EDITABLE];
const MAIN={SSC:['SSC CGL','SSC CHSL','SSC GD'],Maths:['All exams','SSC'],'UP Exams':['UPSSSC','UP Police'],Railway:['RRB NTPC','Group D']};
const FACULTY=['Aditya Ranjan Sir','Jai Sir','Akash Chaturvedi Sir','Shubham Grover Ma\'am','Dilawar Sir','Pulkit Sir','Mohit Sir','Manoj Sir','Vk Sir',"Riya Ma'am"];
const FAQS=['What is the validity of this batch?','Are recordings available?','Can I download the notes?','How do I get my doubts answered?'];
const SAMPLE_NOTE={
  fresh:'A blank new course. Walk it from step 1: the first Continue saves a draft, then Pricing, Content and Additional Settings open.',
  cgl:'Sample course carrying every rule from your notes: ₹999 for 3 years, extension ₹300, upgrade ₹500 with one source at ₹400, add-on ₹200. Exchange is a free swap for now.',
  champ:'Real AppX pricing: ₹449 for 2 years or ₹549 for 3 years. Our plan sells 2 years only, at ₹899. MRP and order count here are for illustration.',
  upsssc:'Real combo, created by hand on 5 Nov. Its plan holds this course plus 3 others at ₹799 for 731 days, with 229 orders.',
  upgkc:'Real combo with 2,630 orders, but it has no course of its own, only a plan. Saving this form would have to create the course.',
  vod:'Real course with 64,662 orders on one plan. Open it to see the view from the source side.',
};
let S={step:1,cur:'cgl',persona:'new',tried:false,C:seed()};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const title=id=>(S.C[id]&&S.C[id].info.title)||CAT[id].t;
const C=()=>S.C[S.cur];
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],C());
const set=(p,v)=>{const ks=p.split('.');const l=ks.pop();ks.reduce((o,k)=>o[k],C())[l]=v};
const days=v=>{const n=Number(v.n)||0;if(v.u==='Lifetime')return 36500;if(v.u==='Source')return null;if(v.u==='Days')return n;if(v.u==='Years')return n===1?365:Math.round(n*365.25);return n===6?183:n===12?365:n*30};
const vtext=v=>{if(v.u==='Lifetime')return 'lifetime';if(v.u==='Source')return 'until the owned course ends';const n=Number(v.n)||0;return `${n} ${(n===1?v.u.replace(/s$/,''):v.u).toLowerCase()}`};
const isCombo=c=>c.incl.combo;
const comboBlocksExch=c=>isCombo(c);

const lengths=c=>[{price:c.base.price,mrp:c.base.mrp,v:c.base.v},...(c.base.multi?c.base.more:[])];
const ext=c=>{
  const e=c.ext,price=Number(c.base.price)||0;
  const win=e.win.m==='def'?DEF.win:Number(e.win.n)||0;
  const v=e.dur.m==='def'?V(6,'Months'):e.dur.v;
  let amount;
  if(e.pr.m==='custom'&&e.pr.kind==='fixed')amount=Number(e.pr.val)||0;
  else{
    const pct=e.pr.m==='custom'?Number(e.pr.val)||0:DEF.pct;
    const min=e.min.m==='def'?DEF.min:Number(e.min.val)||0;
    amount=Math.min(Math.max(Math.round(price*pct/100),min),price);
  }
  return {win,v,amount};
};
const upgPrice=(c,s)=>{const o=c.upg.over[s];return o===undefined||o===''?Number(c.upg.price)||0:Number(o)||0};
const offersInto=cid=>{
  const c=S.C[cid];if(!c||c.settings.free)return [];
  const out=[];
  if(c.upg.on)c.upg.sources.forEach(s=>out.push({kind:'upgrade',source:s,target:cid,price:upgPrice(c,s),v:c.upg.v}));
  if(c.add.on)c.add.rows.filter(r=>r.src).forEach(r=>out.push({kind:'addon',source:r.src,target:cid,price:Number(r.price)||0,v:r.v}));
  return out;
};
const offersOut=cid=>EDITABLE.flatMap(t=>offersInto(t)).filter(o=>o.source===cid);

function personas(){
  const srcs=[...new Set(offersInto(S.cur).map(o=>o.source))];
  const list=[{id:'new',label:'New student, owns nothing',owns:{}}];
  srcs.forEach(s=>list.push({id:'s:'+s,label:'Owns '+title(s),owns:{[s]:{left:200}}}));
  const up=C().upg.on?C().upg.sources:[];
  if(up.length>1)list.push({id:'both',label:`Owns ${up.length} upgrade sources`,owns:Object.fromEntries(up.map(s=>[s,{left:200}]))});
  list.push({id:'self200',label:'Owns this course, 200 days left',owns:{[S.cur]:{left:200}}});
  list.push({id:'self20',label:'Owns this course, 20 days left',owns:{[S.cur]:{left:20}}});
  list.push({id:'lapsed',label:'Owned this course, ended 10 days ago',owns:{[S.cur]:{left:-10}}});
  return list;
}
const persona=()=>personas().find(p=>p.id===S.persona)||personas()[0];

function say(k){
  const c=C();
  const names=a=>a.map(title).join(' or ')||'(no source picked)';
  if(k==='head')return (C().saved&&S.cur!=='fresh'?'Edit: ':'')+title(S.cur);
  if(k==='base')return c.base.multi&&c.base.more.length?`Anyone can buy this for ${lengths(c).map(o=>`${inr(o.price)} for ${vtext(o.v)}`).join(', or ')}. The student picks one.`:`Anyone can buy this for ${inr(c.base.price)}. Access lasts ${vtext(c.base.v)}.`;
  if(k==='ext'){if(!c.ext.on)return 'No extension offer on this course.';const e=ext(c);return `Owners see this ${e.win} days before the end date, and after it: ${vtext(e.v)} more for ${inr(e.amount)}.`}
  if(k==='upg'){if(!c.upg.on)return 'No upgrade offer.';const ov=c.upg.sources.filter(s=>c.upg.over[s]!==undefined&&c.upg.over[s]!=='');return `Owners of ${names(c.upg.sources)} can move to this course for ${inr(c.upg.price)}, for ${vtext(c.upg.v)}. Their old course is removed.`+(ov.length?` ${ov.map(s=>`${title(s)} owners pay ${inr(upgPrice(c,s))}`).join('. ')}.`:'')}
  if(k==='add'){if(!c.add.on||!c.add.rows.length)return 'No add-on offer.';return c.add.rows.map(r=>`Owners of ${r.src?title(r.src):'(no source)'} can add this course for ${inr(r.price)}, ${vtext(r.v)}, and keep both.`).join(' ')}
  if(k==='exch'){if(comboBlocksExch(c))return 'Combos can\'t be exchanged today.';if(!c.exch.on)return 'No exchange offer.';const t=c.exch.targets.map(title).join(' or ')||'(no destination)';return c.exch.mode==='swap'?`Owners can swap this course for ${t}. No money moves and the end date stays the same.`:`Owners can move from this course to ${t} by paying ${inr(c.exch.price)}. They get ${vtext(c.exch.v)} from the day they switch.`}
  if(k==='incl'){const i=c.incl;const n=i.subs.length+i.courses.length+i.tests.length+i.books.length;return n?`A buyer gets this course${i.combo?` shown as a combo of ${i.subs.length}`:''}${i.courses.length?`, ${i.courses.length} more course${i.courses.length>1?'s':''}`:''}${i.tests.length?`, ${i.tests.length} test series`:''}${i.books.length?`, ${i.books.length} book${i.books.length>1?'s':''}`:''}.`:'A buyer gets this course only.'}
  return '';
}

/* field helpers */
const txt=(p,l,ph='',req=false)=>{const id='f-'+p.replace(/\./g,'-');return `<label class="f" for="${id}"><span class="${req?'req':''}">${l}</span><input type="text" id="${id}" data-b="${p}" value="${esc(get(p)??'')}" placeholder="${esc(ph)}"></label>`};
const area=(p,l,req=false)=>{const id='f-'+p.replace(/\./g,'-');return `<label class="f" for="${id}"><span class="${req?'req':''}">${l}</span><textarea id="${id}" data-b="${p}">${esc(get(p)??'')}</textarea></label>`};
const inp=(p,l,ph='')=>{const id='f-'+p.replace(/\./g,'-');const v=get(p);return `<label class="f" for="${id}">${l}<input type="text" inputmode="numeric" id="${id}" data-b="${p}" value="${esc(v??'')}" placeholder="${esc(ph)}"></label>`};
const vsel=(p,l,src=false)=>{const v=get(p);const id='f-'+p.replace(/\./g,'-');const noN=v.u==='Lifetime'||v.u==='Source';const pair=`<div class="pair"><input type="text" inputmode="numeric" id="${id}-n" aria-label="${esc(l||'Length')}" data-b="${p}.n" value="${noN?'':esc(v.n)}" ${noN?'disabled':''}><select id="${id}-u" aria-label="Unit" data-b="${p}.u">${['Days','Months','Years','Lifetime',...(src?['Source']:[])].map(u=>`<option value="${u}" ${v.u===u?'selected':''}>${u==='Source'?'Ends with owned course':u}</option>`).join('')}</select></div>`;return l?`<div class="f"><span style="font-weight:500;font-size:13px">${l}</span>${pair}</div>`:pair};
const radio=(p,val,label)=>`<label class="radio"><input type="radio" name="${p}" data-b="${p}" value="${val}" ${get(p)===val?'checked':''}> ${label}</label>`;
const sw=(p,text)=>`<button class="switch ${get(p)?'on':''}" data-act="flip" data-p="${p}" aria-pressed="${!!get(p)}"><i></i>${text}</button>`;
const sentence=k=>`<div class="say" data-s="${k}">${esc(say(k))}</div>`;
const courseOpts=(exclude,ph)=>`<option value="">${ph}</option>`+Object.keys(CAT).filter(k=>!exclude.includes(k)).map(k=>`<option value="${k}">${esc(title(k))}</option>`).join('');
const chips=(list,p,nameOf)=>list.map(id=>`<span class="chip">${esc(nameOf(id))}<button data-act="rm" data-p="${p}" data-id="${id}" aria-label="Remove ${esc(nameOf(id))}">×</button></span>`).join('');
const pickSel=(p,opts,id)=>`<select class="pick" id="${id}" aria-label="Add" data-add="${p}">${opts}</select>`;

/* editors: the same fields in every layout */
const ED={
  base(){const c=C();return `<div class="fields" style="margin-top:0">${inp('base.mrp','MRP (₹)')}${inp('base.price','Selling price (₹)')}${vsel('base.v','Validity')}</div>
    <div class="row">${sw('base.multi','Access Duration Based Pricing')}<span class="small">Set the price based on how long students get access, such as 2 years or 3 years.</span></div>
    ${c.base.multi?`<div class="f"><span class="sect">More pricing plans</span><span class="small">Validity, MRP, selling price. The fields above are the first pricing plan.</span>
      ${c.base.more.map((r,i)=>`<div class="lenrow">${vsel(`base.more.${i}.v`)}<input type="text" inputmode="numeric" id="len-mrp-${i}" aria-label="MRP" data-b="base.more.${i}.mrp" value="${esc(r.mrp)}"><input type="text" inputmode="numeric" id="len-price-${i}" aria-label="Selling price" data-b="base.more.${i}.price" value="${esc(r.price)}"><button class="x" data-act="rmlen" data-i="${i}" aria-label="Remove pricing plan">×</button></div>`).join('')}
      <div style="margin-top:6px"><button class="btn" data-act="addlen">Add pricing plan</button></div></div>`:''}
    ${sentence('base')}`},
  incl(){const c=C(),i=c.incl;const taken=[S.cur,...i.subs,...i.courses];const anyAdd=i.subs.length+i.courses.length+i.tests.length+i.books.length>0;const orders=CAT[S.cur].orders;
    return `<div class="row">${sw('incl.combo','Make this a combo')}<span class="small">Adds the Sub Courses tab on the course page, and the Combo tab in the catalogue.</span></div>
    ${i.combo?`<div class="f"><span class="sect">Sub courses</span><div class="chips">${chips(i.subs,'incl.subs',title)}${pickSel('incl.subs',courseOpts(taken,'Add a sub course'),'pick-subs')}</div></div>`:''}
    <div class="f"><span class="sect">Attach other products</span><span class="small">The student simply gets access. Nothing extra shows on the course page.</span></div>
    <div class="fields" style="margin-top:0">
      <div class="f"><span class="small">Courses</span><div class="chips">${chips(i.courses,'incl.courses',title)}${pickSel('incl.courses',courseOpts(taken,'Add a course'),'pick-courses')}</div></div>
      <div class="f"><span class="small">Test series</span><div class="chips">${chips(i.tests,'incl.tests',x=>TESTS[x])}${pickSel('incl.tests','<option value="">Add a test series</option>'+Object.keys(TESTS).filter(k=>!i.tests.includes(k)).map(k=>`<option value="${k}">${TESTS[k]}</option>`).join(''),'pick-tests')}</div></div>
      <div class="f"><span class="small">Books</span><div class="chips">${chips(i.books,'incl.books',x=>BOOKS[x])}${pickSel('incl.books','<option value="">Add a book</option>'+Object.keys(BOOKS).filter(k=>!i.books.includes(k)).map(k=>`<option value="${k}">${BOOKS[k]}</option>`).join(''),'pick-books')}</div></div>
    </div>
    ${anyAdd&&orders?`<div class="note"><b>Additions reach past buyers too.</b> The ${orders.toLocaleString('en-IN')} existing orders on this course get anything you add. Removing an item can take it away from them, so the form asks first.</div>`:''}
    ${sentence('incl')}`},
  ext(){const c=C(),e=c.ext;const fixed=e.pr.m==='custom'&&e.pr.kind==='fixed';
    return `<div class="row"><label class="radio"><input type="radio" name="ext.on_" data-b="ext.on_" value="on" ${e.on?'checked':''}> On</label><label class="radio"><input type="radio" name="ext.on_" data-b="ext.on_" value="off" ${e.on?'':'checked'}> Off for this course</label></div>
    ${e.on?`<div class="indent"><p class="sect">Show before expiry <span class="tag new">NEW</span></p>${radio('ext.win.m','def',`Default (${DEF.win} days)`)}<div class="row">${radio('ext.win.m','custom','Custom')}${e.win.m==='custom'?`<div style="width:90px">${inpBare('ext.win.n','Days before expiry')}</div><span class="small">days before the end date</span>`:''}</div></div>
    <div class="indent"><p class="sect">Duration</p>${radio('ext.dur.m','def',`Default (${DEF.dayText})`)}<div class="row">${radio('ext.dur.m','custom','Custom')}${e.dur.m==='custom'?`<div style="width:190px">${vsel('ext.dur.v')}</div>`:''}</div></div>
    <div class="indent"><p class="sect">Price</p>${radio('ext.pr.m','def',`Default (${DEF.pct}% of what the student paid)`)}<div class="row">${radio('ext.pr.m','custom','Custom')}${e.pr.m==='custom'?`<select id="ext-kind" aria-label="Price type" data-b="ext.pr.kind"><option value="fixed" ${e.pr.kind==='fixed'?'selected':''}>Fixed price ₹</option><option value="percent" ${e.pr.kind==='percent'?'selected':''}>% of what the student paid</option></select><div style="width:90px">${inpBare('ext.pr.val','Extension price')}</div>`:''}</div></div>
    <div class="indent"><p class="sect">Minimum price</p>${fixed?'<span class="small">Not used with a fixed price.</span>':`${radio('ext.min.m','def',`Default (${inr(DEF.min)})`)}<div class="row">${radio('ext.min.m','custom','Custom')}${e.min.m==='custom'?`<div style="width:90px">${inpBare('ext.min.val','Minimum price')}</div>`:''}</div>`}</div>`:''}
    ${sentence('ext')}`},
  upg(){const c=C(),u=c.upg;const taken=[S.cur,...u.sources];
    return `<div class="row">${sw('upg.on','Offer an upgrade')}<span class="small">You pick the courses students come from. They lose that course when they pay.</span></div>
    ${u.on?`<div class="fields" style="margin-top:0">${inp('upg.price','Common price (₹)')}${vsel('upg.v','Validity')}</div>
    <div class="f"><span class="sect">Source courses</span>
      ${u.sources.map(s=>`<div class="srcrow"><span>${esc(title(s))}</span><input type="text" inputmode="numeric" id="ov-${s}" aria-label="Price for ${esc(title(s))}" data-b="upg.over.${s}" value="${esc(u.over[s]??'')}" placeholder="Common"><button class="x" data-act="rm" data-p="upg.sources" data-id="${s}" aria-label="Remove ${esc(title(s))}">×</button></div>`).join('')}
      <div style="margin-top:6px">${pickSel('upg.sources',courseOpts(taken,'Add a source course'),'pick-upg')}</div></div>`:''}
    ${sentence('upg')}`},
  add(){const c=C(),a=c.add;
    return `<div class="row">${sw('add.on','Offer as an add-on')}<span class="small">Owners of the source keep it and add this course.</span></div>
    ${a.on?`<div class="f"><span class="sect">Source, price, validity</span>
      ${a.rows.map((r,i)=>`<div class="addrow"><select id="add-src-${i}" aria-label="Source course" data-b="add.rows.${i}.src">${courseOpts([S.cur],'Pick a source').replace(`value="${r.src}"`,`value="${r.src}" selected`)}</select><input type="text" inputmode="numeric" id="add-price-${i}" aria-label="Add-on price" data-b="add.rows.${i}.price" value="${esc(r.price)}">${vsel(`add.rows.${i}.v`,'',true)}<button class="x" data-act="rmrow" data-i="${i}" aria-label="Remove row">×</button></div>`).join('')}
      <div style="margin-top:6px"><button class="btn" data-act="addrow">Add a source</button></div></div>`:''}
    ${sentence('add')}`},
  exch(){const c=C(),x=c.exch;
    if(comboBlocksExch(c))return `<div class="note"><b>Combos can't be exchanged today.</b> Exchange works only between plans holding one course, because a swap inside a combo was ambiguous for the student. That was decided on 22 Oct.</div>`;
    const taken=[S.cur,...x.targets];
    return `<div class="row">${sw('exch.on','Offer an exchange')}<span class="small">You pick the courses students go to.</span></div>
    ${x.on?`<div class="f"><span class="sect">Destination courses</span><div class="chips">${chips(x.targets,'exch.targets',title)}${pickSel('exch.targets',courseOpts(taken,'Add a destination'),'pick-exch')}</div></div>
    <div class="small">Free swap, same end date. A paid exchange comes in a later phase.</div>`:''}
    ${sentence('exch')}`},
};
const inpBare=(p,l)=>{const id='f-'+p.replace(/\./g,'-');return `<input type="text" inputmode="numeric" id="${id}" aria-label="${esc(l)}" data-b="${p}" value="${esc(get(p)??'')}">`};

const TITLES={base:['Price and validity','Rule 2. The price anyone can buy at.'],incl:['What is included','Sub courses and attached courses, tests, books.'],ext:['Extension','Rule 3. Same fields as the Plans bulk dialog, plus when it shows.'],upg:['Upgrade','Rule 4. Students pay to move here from another course. The old course is removed.'],add:['Add-on','Rule 5. Students pay to add this course. They keep both.'],exch:['Exchange','Rule 6. Students swap this course for another, free for now.']};

const card=k=>`<div class="card"><h3>${TITLES[k][0]}</h3><p class="sub">${TITLES[k][1]}</p><div class="body">${ED[k]()}</div></div>`;
function reverse(){
  const out=offersOut(S.cur);
  if(!out.length)return '';
  return `<div class="card"><h3>Offers shown to owners of this course</h3><p class="sub">Set on the other course. Listed here so nobody hunts for them. Your note: plan should show in source.</p><div class="body" style="gap:0">
  ${out.map(o=>`<div class="out"><span>${o.kind==='upgrade'?'Upgrade':'Add-on'} to ${esc(title(o.target))} for ${inr(o.price)}, ${vtext(o.v)}</span><button class="link" data-act="goto" data-id="${o.target}" data-k="${o.kind==='upgrade'?'upg':'add'}">Edit</button></div>`).join('')}
  </div></div>`;
}
const STEPS=['Basic Course Information','Pricing','Content','Additional Settings'];
const missing=()=>{const i=C().info,m=[];if(!i.title.trim())m.push('Course title');if(!i.desc.trim())m.push('Course description');if(!i.main)m.push('Main category');if(!i.cat)m.push('Category');if(!i.faculty.length)m.push('At least one faculty member');return m};
const locked=n=>!C().saved&&n>1;
function stepper(){return STEPS.map((t,i)=>{const n=i+1;const cls=S.step===n?'on':S.step>n?'done':'';return `${i?'<i class="stepline" aria-hidden="true"></i>':''}<span class="${cls}"><button data-act="step" data-n="${n}" ${locked(n)?'disabled':''} ${S.step===n?'aria-current="step"':''}><b>${S.step>n?'✓':n}</b>${t}</button></span>`}).join('')}
const stepTop=()=>`<div class="top"><div class="row"><h2 data-s="head">${esc(say('head'))}</h2><span class="grow"></span><button class="btn" data-act="toast" data-m="Closed without saving.">Close</button><button class="btn pri" data-act="saveall">${C().saved?'Save changes':'Save draft'}</button></div><div class="steps row">${stepper()}</div></div>`;

function step1(){

  const banner=(k,label,hint)=>`<div class="upload"><span style="font-weight:500;font-size:13px">${label}</span>${i[k]?`<div class="ban">${esc(title(S.cur))}</div>`:`<div class="ban none">${hint}</div>`}<div class="row"><button class="btn" data-act="flip" data-p="info.${k}">${i[k]?'Remove':'Upload image'}</button></div></div>`;

  <div class="card"><h3>Basic Information</h3><div class="body">
    ${txt('info.title','Course Title','Name students will see',true)}
    ${txt('info.short','Short Description','One line for the course card (optional)')}

function step2(){

function step3(){
  const c=C(),t=c.content;
  const combo=c.incl.combo;
  return `<div class="card"><h3>Classes, tests and PDFs</h3><p class="sub">${combo?'A combo gets its content from its sub courses. It can also hold its own.':'Added on the Assigned Classes screen, as today.'}</p><div class="body">
    <div class="stat"><div><span>Classes</span><b>${t.classes}</b></div><div><span>Tests</span><b>${t.tests}</b></div><div><span>PDFs</span><b>${t.pdfs}</b></div></div>
    <div class="row"><button class="btn" data-act="toast" data-m="Opens Assigned Classes, the existing screen.">Open Assigned Classes</button>${t.classes?'':`<button class="btn" data-act="addclasses">Add sample classes</button>`}</div>
  </div></div>
  <div class="card"><h3>Course Highlights</h3><div class="body"><div>
    ${t.highlights.map((h,i)=>`<div class="hl"><input type="text" id="hl-t-${i}" aria-label="Highlight title" data-b="content.highlights.${i}.title" value="${esc(h.title)}" placeholder="Title"><input type="text" id="hl-c-${i}" aria-label="Highlight content" data-b="content.highlights.${i}.content" value="${esc(h.content)}" placeholder="Content"><button class="x" data-act="rmat" data-p="content.highlights" data-i="${i}" aria-label="Remove highlight">×</button></div>`).join('')}
  </div><div><button class="btn" data-act="pushhl">Add highlight</button></div></div></div>
  <div class="card"><h3>Time Table</h3><div class="body"><div class="row">${sw('content.timetable','Enable Time Table')}</div>
    ${t.timetable?`<div>${t.schedule.map((h,i)=>`<div class="hl"><input type="text" id="tt-t-${i}" aria-label="Subject or topic" data-b="content.schedule.${i}.topic" value="${esc(h.topic)}" placeholder="Subject/Topic"><input type="text" id="tt-c-${i}" aria-label="Time schedule" data-b="content.schedule.${i}.time" value="${esc(h.time)}" placeholder="Time Schedule"><button class="x" data-act="rmat" data-p="content.schedule" data-i="${i}" aria-label="Remove row">×</button></div>`).join('')}</div><div><button class="btn" data-act="pushtt">Add class schedule</button></div>`:''}
  </div></div>
  <div class="card"><h3>FAQ</h3><div class="body"><div class="chips">${chips(t.faqs,'content.faqs',x=>x)}${pickSel('content.faqs','<option value="">Add a FAQ</option>'+FAQS.filter(x=>!t.faqs.includes(x)).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join(''),'pick-faq')}</div></div></div>`;
}
function checks(){
  const c=C(),l=[];
  if(!c.settings.free)l.push(Number(c.base.price)>0?['ok',`Selling price ${inr(c.base.price)}`]:['warn','No selling price. Students can only get this course inside a combo.']);
  l.push(c.info.web||c.info.app?['ok','Banner added']:['warn','No banner yet. Students see a plain card.']);
  l.push(c.content.classes||c.incl.subs.length?['ok',c.content.classes?`${c.content.classes} classes`:`${c.incl.subs.length} sub courses`]:['warn','No classes yet. Students would buy an empty course.']);
  return l;
}
function step4(){
  const st=C().settings;
  const flag=(p,t,d)=>`<div class="flag">${sw(p,t)}<span class="small">${d}</span></div>`;
  return `<div class="card"><h3>Status</h3><p class="sub">Active puts the course on sale. Inactive takes it off sale, and buyers keep their access. A new course starts as Draft.</p><div class="body">
    <label class="f" for="f-status" style="max-width:240px">Status<select id="f-status" data-b="settings.status"><option value="active" ${st.status==='active'?'selected':''}>Active</option><option value="inactive" ${st.status==='inactive'?'selected':''}>Inactive</option><option value="draft" ${st.status==='draft'?'selected':''}>Draft</option></select></label>
    <div><p class="sect">Ready to sell?</p>${checks().map(([k,t])=>`<div class="check"><b class="${k}">${k==='ok'?'✓':k==='bad'?'✕':'!'}</b><span>${esc(t)}</span></div>`).join('')}</div>
    <div class="flag">${sw('settings.closed','Close Admission')}<span class="small">Stays visible, but nobody new can buy it. The price is kept.</span></div>
  </div></div>
  <div class="card"><h3>Course type and listing</h3><div class="body"><div class="flags">
    ${flag('settings.free','Is Free','Anyone can open it. No plan is made.')}${flag('settings.live','Live Course','Shows under Live.')}${flag('settings.rec','Recorded Course','Shows under Recorded.')}${flag('settings.inNew','Show in New section','Shows in the New section of the catalogue.')}${flag('settings.old','Old batch','Shows under Old.')}
  </div><div style="max-width:160px">${inp('settings.priority','Priority')}</div></div></div>`;
}
function main(){
  const body=[step1,step2,step3,step4][S.step-1]();
  const last=S.step===4;
  return stepTop()+`<div class="small">${esc(SAMPLE_NOTE[S.cur])}</div>`+body+`<div class="row"><span class="grow"></span>${S.step>1?'<button class="btn" data-act="back">Back</button>':''}<button class="btn pri" data-act="${last?'saveall':'next'}">${last?(C().saved?'Save changes':'Save draft'):(!C().saved?'Save draft and continue':'Continue')}</button></div>`;
}

/* student's side */
function offerStrip(o){const up=o.kind==='upgrade';return `<div class="mini"><span>${up?'Upgrade to':'Add'} ${esc(title(o.target))}<br><span class="meta">${vtext(o.v)}. ${up?'Replaces this course.':'You keep this course.'}</span></span><em>${inr(o.price)}</em></div>`}
function studentCard(){
  const c=C(),p=persona(),own=p.owns[S.cur];
  const i=c.incl;
  const incl=[...i.courses.map(title),...i.tests.map(x=>TESTS[x]),...i.books.map(x=>BOOKS[x])];
  const inclHtml=(i.combo&&i.subs.length?`<div><span class="tabline">Sub Courses</span><div class="minis" style="margin-top:8px">${i.subs.map(s=>`<div class="mini"><span>${esc(title(s))}</span><em>View Course</em></div>`).join('')}</div></div>`:'');
  let inner='';
  if(own){
    const e=ext(c);const lapsed=own.left<0;
    const offerExt=c.ext.on&&(lapsed||own.left<=e.win);
    inner+=`<div class="meta">${lapsed?`Ended ${-own.left} days ago`:`You own this. ${own.left} days left.`}</div>`;
    if(offerExt)inner+=`<div class="price">${inr(e.amount)}</div><div class="meta">Extend by ${vtext(e.v)}</div><span class="cta">Extend</span>`;
    else if(lapsed)inner+=`<span class="cta dis">Access ended</span>`;
    else inner+=`<span class="cta ghost">Open course</span>`;
    if(!lapsed&&c.exch.on&&!comboBlocksExch(c)&&c.exch.targets.length){
      inner+=`<div class="minis">${c.exch.targets.map(t=>`<div class="mini"><span>Exchange to ${esc(title(t))}<br><span class="meta">${c.exch.mode==='swap'?'Same end date':vtext(c.exch.v)}</span></span><em>${c.exch.mode==='swap'?'Free':inr(c.exch.price)}</em></div>`).join('')}</div>`;
    }
    const out=offersOut(S.cur);
    if(!lapsed&&out.length)inner+=`<div class="minis">${out.map(offerStrip).join('')}</div>`;
  }else{
    const owned=Object.keys(p.owns);
    const best=offersInto(S.cur).filter(o=>owned.includes(o.source)).sort((a,b)=>a.price-b.price)[0];
    const price=Number(c.base.price)||0,mrp=Number(c.base.mrp)||0;
    const open=c.settings.status==='active'&&!c.settings.closed;
    if(c.settings.free)inner+=`<div class="price">Free</div><span class="cta">Start learning</span>`;
    else if(open&&!price&&!best)inner+=`<div class="meta">Available only inside a combo</div><span class="cta dis">View combos</span>`;
    else if(!open&&!best){inner+=`<div class="price">${price?inr(price):'Price not set'}</div><div class="meta">${c.settings.closed?'Admission closed':c.settings.status==='draft'?'Draft. Students can\'t see this yet.':'Off sale. Buyers keep their access.'}</div><span class="cta dis">Not on sale</span>`}
    else if(best){
      const pct=price>best.price?Math.round((1-best.price/price)*100):0;
      inner+=`<div class="price">${inr(best.price)}${price>best.price?`<s>${inr(price)}</s><span class="off-pill">${pct}% OFF</span>`:''}</div><div class="meta">${best.kind==='upgrade'?`Replaces ${esc(title(best.source))}. You lose access to it when you pay.`:`You keep ${esc(title(best.source))}.`} Valid ${vtext(best.v)}.</div><span class="cta">${best.kind==='upgrade'?'Upgrade':'Add to my courses'}</span>`;
    }else{
      const pct=mrp>price?Math.round((1-price/mrp)*100):0;
      if(c.base.multi&&c.base.more.length)inner+=`<div class="minis">${lengths(c).map((o,n)=>`<div class="mini" ${n===0?'style="border-color:var(--ink)"':''}><span>${vtext(o.v)}</span><em>${inr(o.price)}</em></div>`).join('')}</div><span class="cta">Buy Now</span>`;
      else inner+=`<div class="price">${inr(price)}${mrp>price?`<s>${inr(mrp)}</s><span class="off-pill">${pct}% OFF</span>`:''}</div><div class="meta">Valid ${vtext(c.base.v)}</div><span class="cta">Buy Now</span>`;
    }
  }
  const i0=c.info;
  return `<div class="stu">${i0.web||i0.app?`<div class="ban">${esc(title(S.cur))}</div>`:'<div class="ban none">No banner yet</div>'}<h4>${esc(title(S.cur))}</h4>${i0.short?`<div class="meta">${esc(i0.short)}</div>`:''}${i0.faculty.length?`<div class="meta">By ${i0.faculty.map(esc).join(', ')}</div>`:''}${inner}${inclHtml}</div>`;
}
function sourceCards(){
  const p=persona();
  const owned=Object.keys(p.owns);
  // A target shows once, at the price checkout charges: the cheapest offer among the courses this student owns.
  const best={};
  owned.flatMap(offersOut).filter(o=>!p.owns[o.target]).forEach(o=>{if(!best[o.target]||o.price<best[o.target].price)best[o.target]=o});
  return owned.filter(s=>s!==S.cur).map(s=>{
    const os=Object.values(best).filter(o=>o.source===s);
    if(!os.length)return '';
    return `<div><p class="lbl">Same student, on the page of the course they own <span class="tag app">APP</span></p><div class="stu"><h4>${esc(title(s))}</h4><div class="meta">You own this. ${p.owns[s].left} days left.</div><span class="cta ghost">Open course</span><div class="minis">${os.map(offerStrip).join('')}</div></div></div>`;
  }).join('');
}
/* what gets written: one plan per distinct way to buy */
function plansFor(){
  const c=C(),i=c.incl,out=[];
  const contents=[S.cur,...i.subs,...i.courses];
  const baseLines=[
    ['live',`amount ${c.base.price}, mrp ${c.base.mrp}, duration ${days(c.base.v)}`],
    ['live',`course [${contents.length} ${contents.length===1?'course':'courses'}], packages [${i.tests.length}], ebook [${i.books.length}]`],
    ['new','singleCourseId, the link back to this course'],
  ];
  if(i.combo)baseLines.push(['new',`Course.subCourses [${i.subs.length}], shown as the Sub Courses tab`]);
  if(c.ext.on){const e=ext(c);baseLines.push(['live',`extensionTerms: ${vtext(e.v)}, ${inr(e.amount)}`]);if(c.ext.win.m==='custom')baseLines.push(['new',`extensionTerms.windowDays ${e.win}. Today one env value sets it for all plans`])}
  else baseLines.push(['live','extensionTerms: off']);
  const xOn=c.exch.on&&!comboBlocksExch(c)&&c.exch.targets.length;
  if(xOn){baseLines.push(['live',`exchangeToPlanIds [${c.exch.targets.length}]`]);if(c.exch.mode==='paid')baseLines.push(['new',`exchange price ${c.exch.price}, ${days(c.exch.v)} days. Today a swap moves no money and keeps the end date`])}
  out.push({name:c.base.multi&&c.base.more.length?`Main plan, ${vtext(c.base.v)}`:'Main plan, sold to anyone',lines:baseLines});
  if(c.base.multi)c.base.more.forEach(o=>out.push({name:`Main plan, ${vtext(o.v)}`,lines:[
    ['live',`amount ${o.price}, mrp ${o.mrp}, duration ${days(o.v)}, same contents and offer terms`],
    ['new','courseSale key main:<option id>, so edits keep the plan id'],
    ['app','the course page lists both lengths. Needs a test in the app'],
  ]}));
  if(c.upg.on&&c.upg.sources.length){
    const by={};c.upg.sources.forEach(s=>{const k=upgPrice(c,s);(by[k]=by[k]||[]).push(s)});
    Object.entries(by).forEach(([price,srcs])=>out.push({name:`Upgrade plan at ${inr(price)}`,lines:[
      ['live',`upgradationPlanIds [${srcs.length} source plan${srcs.length>1?'s':''}], upgradationPrice ${price}, duration ${days(c.upg.v)}`],
      ['new','on payment, every order the student holds on the source plan stops giving access. Today the source order is left alone'],
      ['new','owning this course must be checked across its plans'],
    ]}));
  }
  if(c.add.on)c.add.rows.filter(r=>r.src).forEach(r=>{const d=days(r.v);out.push({name:`Add-on plan at ${inr(r.price)}`,lines:[
    ['live',`upgradationPlanIds [1 source plan], upgradationPrice ${r.price}${d?`, duration ${d}`:''}`],
    ['new',d?'kind add-on, so the app can word it differently':'kind add-on, and an end date copied from the owned course'],
  ]})});
  return out;
}
function writes(){
  if(S.step===4){const st=C().settings,on=st.status==='active'&&!st.closed;return `<div class="card"><h3>What gets saved</h3><div class="writes"><div class="pl"><b>Course and its plans</b><div class="ln"><span class="tag live">LIVE</span><code>Course.status ${st.status}, priority ${st.priority}</code></div><div class="ln"><span class="tag new">NEW</span><code>${on?'main plans listed on the course':'main plans stop selling but stay active, so buyers keep access'}</code></div>${st.closed?'<div class="ln"><span class="tag new">NEW</span><code>Close Admission keeps the price. Today it sets the price to 0</code></div>':''}</div></div></div>`}
  if(S.step!==2||C().settings.free)return '';
  if(!(Number(C().base.price)>0))return `<div class="card"><h3>What gets saved</h3><p class="sub">No main plan until there is a selling price. With no price, students can only get this course inside a combo.</p></div>`;
  const ps=plansFor();
  const hasOffer=ps.length>1;
  return `<div class="card"><h3>What gets saved</h3><p class="sub">${ps.length} plan${ps.length>1?'s':''} behind this one form.</p>
  <div class="legend" style="margin-top:8px"><span><span class="tag live">LIVE</span> field exists</span><span><span class="tag new">NEW</span> backend work</span><span><span class="tag app">APP</span> app work</span></div>
  <div class="writes">${ps.map(p=>`<div class="pl"><b>${esc(p.name)}</b>${p.lines.map(([t,x])=>`<div class="ln"><span class="tag ${t}">${t.toUpperCase()}</span><code>${esc(x)}</code></div>`).join('')}</div>`).join('')}
  ${hasOffer?`<div class="pl"><b>Showing on the source course</b><div class="ln"><span class="tag live">LIVE</span><code>My plans: upgradeOffers on the source card</code></div><div class="ln"><span class="tag app">APP</span><code>Course page: nothing shows on the source today</code></div></div>`:''}
  </div>
  ${hasOffer?`<p class="small" style="margin:10px 0 0">Why not one plan: a plan with an Upgrade offer refuses everyone who does not qualify, so the public price and the upgrade can't share it.</p>`:''}
  </div>`;
}
function asideHtml(){
  const ps=personas();
  return `<div class="card" style="padding:12px 14px"><label for="who" class="lbl" style="display:block">Preview as</label><select class="who" id="who" data-act-change="persona">${ps.map(p=>`<option value="${p.id}" ${persona().id===p.id?'selected':''}>${esc(p.label)}</option>`).join('')}</select></div>
  <div><p class="lbl">Course page</p>${studentCard()}</div>
  ${sourceCards()}
  ${writes()}`;
}
function live(){
  document.querySelectorAll('[data-s]').forEach(el=>{el.textContent=say(el.dataset.s)});
  $('aside').innerHTML=asideHtml();
}
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
function render(){
  $('course').innerHTML=SAMPLES.map(k=>`<option value="${k}" ${S.cur===k?'selected':''}>${esc(title(k))}</option>`).join('');
  $('main').innerHTML=main();
  $('aside').innerHTML=asideHtml();
}
function goStep(n){S.step=n;S.tried=false;render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,c=C();
  const go={
    step(){return goStep(+t.dataset.n)},
    next(){if(S.step===1&&missing().length){S.tried=true;return render()}if(!c.saved){c.saved=true;toast('Draft saved. Students can\'t see it yet.')}goStep(S.step+1)},
    back(){goStep(S.step-1)},
    saveall(){if(S.step===1&&missing().length){S.tried=true;return render()}c.saved=true;toast(c.settings.status==='active'?'Saved. Plans are in step with this form.':'Saved as '+c.settings.status+'.');render()},
    toast(){toast(t.dataset.m)},
    addclasses(){c.content.classes=40;c.content.pdfs=30;render()},
    pushhl(){c.content.highlights.push({title:'',content:''});render()},
    pushtt(){c.content.schedule.push({topic:'',time:''});render()},
    rmat(){get(t.dataset.p).splice(+t.dataset.i,1);render()},
    flip(){set(t.dataset.p,!get(t.dataset.p));if(t.dataset.p==='add.on'&&get('add.on')&&!c.add.rows.length)c.add.rows.push({src:'',price:200,v:V(2,'Years')});if(t.dataset.p==='base.multi'&&get('base.multi')&&!c.base.more.length)c.base.more.push({price:c.base.price,mrp:c.base.mrp,v:V(3,'Years')})},
    rm(){const list=get(t.dataset.p);list.splice(list.indexOf(t.dataset.id),1);if(t.dataset.p==='upg.sources')delete c.upg.over[t.dataset.id]},
    rmrow(){c.add.rows.splice(+t.dataset.i,1)},
    addrow(){c.add.rows.push({src:'',price:200,v:V(2,'Years')})},
    addlen(){c.base.more.push({price:c.base.price,mrp:c.base.mrp,v:V(3,'Years')})},
    rmlen(){c.base.more.splice(+t.dataset.i,1)},
    goto(){S.cur=t.dataset.id;S.persona='new';S.step=2},
  }[a];
  if(go){const keepsOwn=['step','next','back','saveall','toast','addclasses','pushhl','pushtt','rmat'].includes(a);go();if(!keepsOwn)render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.b===undefined||(el.type!=='text'&&el.tagName!=='TEXTAREA'))return;
  set(el.dataset.b,el.value);
  live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.actChange==='course'){S.cur=el.value;S.persona='new';S.step=1;S.tried=false;render();window.scrollTo(0,0);return}
  if(el.dataset.tag){if(el.value.trim())C().info.tags.push(el.value.trim());render();return}
  if(el.dataset.actChange==='persona'){S.persona=el.value;live();return}
  if(el.dataset.add!==undefined){if(el.value){get(el.dataset.add).push(el.value);render()}return}
  if(el.dataset.b==='ext.on_'){C().ext.on=el.value==='on';render();return}
  if(el.dataset.b==='info.main')C().info.cat='';
  if(el.dataset.b!==undefined&&el.type!=='text'&&el.tagName!=='TEXTAREA'){set(el.dataset.b,el.value);render()}
});
render();
</script>
</body>
</html>
