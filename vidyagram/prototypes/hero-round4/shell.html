<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vidyagram — Village of Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:#16140F;font:400 16px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
/* ---------- header ---------- */
.vhd{position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 1px 0 #EFEAE0}
.hdr{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{width:52px;height:52px;border-radius:50%;display:block}
.brand b{display:block;font:700 21px/1.1 Poppins,sans-serif;letter-spacing:-.01em;color:#16140F}
.brand small{display:block;font:600 11px/1.3 Poppins,sans-serif;letter-spacing:.16em;color:#B07D00}
.hsep{width:1px;height:40px;background:#ECE6D8;flex:none}
.hnav{display:flex;align-items:center;gap:10px}
.np{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid #ECE6D8;font:500 15px Poppins,sans-serif;color:#16140F;text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s}
.np:hover{border-color:#E8A500;background:#FFFBF0}
.np svg{flex:none}
.np .chev{margin-left:-2px;transition:transform .2s}
.more{position:relative}
.more-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;margin:0;padding:8px;list-style:none;background:#fff;border:1px solid #ECE6D8;border-radius:14px;box-shadow:0 18px 40px -18px rgba(22,20,15,.35)}
.more-menu[hidden]{display:none}
.more-menu a{display:block;padding:10px 12px;border-radius:9px;font:500 14px Poppins,sans-serif;text-decoration:none}
.more-menu a:hover{background:#FFF6DC}
.hact{margin-left:auto;display:flex;align-items:center;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:#16140F;cursor:pointer}
.ib:hover{background:#F4F1EA}
.ib.tg{background:#F2F0EC}
.lg{display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:12px;background:#16140F;color:#fff;font:600 16px Poppins,sans-serif;text-decoration:none}
.lg:hover{background:#2A2620}
.mbtn{display:none}
:focus-visible{outline:3px solid #E8A500;outline-offset:2px}
/* ---------- marquee ---------- */
.tick{display:flex;align-items:center;height:34px;background:#1E1C19;color:#BDB5A4;overflow:hidden}
.tick .trk{flex:1;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tick .run{display:flex;width:max-content;animation:tk 60s linear infinite}
.tick.paused .run{animation-play-state:paused}
.tick .ti{display:inline-flex;align-items:center;gap:10px;padding:0 26px;white-space:nowrap;font:500 13px Figtree,sans-serif;border-right:1px solid #3A362E}
.tick .ti b{font:800 10px Figtree,sans-serif;letter-spacing:.04em;color:#FFC21A}
.tick .pz{flex:none;width:30px;height:30px;margin:0 12px;border:0;border-radius:50%;background:none;color:#8A847A;cursor:pointer;display:grid;place-items:center}
.tick .pz:hover{color:#FFC21A}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick .run{animation:none}}
/* ---------- responsive ---------- */
@media (max-width:1080px){.hnav,.hsep,.hact .hs{display:none}.mbtn{display:grid}.hdr{height:64px;gap:12px}.brand img{width:44px;height:44px}.brand b{font-size:19px}.brand small{font-size:9.5px}.lg{height:42px;padding:0 18px;font-size:15px}}
@media (max-width:520px){.wrap{padding:0 16px}.lg,.ib.tg{display:none}}
#hero-host{display:block}
/* preview: every button and link is switched off */
a,button{pointer-events:none!important;cursor:default!important}
</style>
