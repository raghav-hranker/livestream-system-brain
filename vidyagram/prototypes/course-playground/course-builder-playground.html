<title>Course Builder Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: two working panes. The library (left) feeds the new course outline (right); a sticky tray carries the ticked content across. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --sunk:#eceff3; --hover:#f5f7f9;
  --ink:#15202b; --muted:#566373; --faint:#8794a2;
  --line:#dde2e8; --line-strong:#c4ccd5;
  --accent:#0d7a69; --accent-ink:#ffffff; --accent-soft:#e2f2ee; --accent-line:#93d1c4;
  --danger:#b42318; --danger-soft:#fdecea;
  --k-class:#15202b; --k-pdf:#c2410c; --k-test:#6d28d9;
  --s0:#2563eb; --s1:#c77700; --s2:#d02670; --s3:#0e8aa8; --s4:#5b8f00; --s5:#8a3ffc;
  --shadow:0 1px 2px rgba(15,25,40,.06),0 6px 20px rgba(15,25,40,.07);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#151c23; --sunk:#10161c; --hover:#1b242d;
  --ink:#e4ebf2; --muted:#9aa8b6; --faint:#6f7d8b;
  --line:#25303a; --line-strong:#364350;
  --accent:#34c4ab; --accent-ink:#06201b; --accent-soft:#11302b; --accent-line:#1f6a5d;
  --danger:#ff8a7a; --danger-soft:#3a1915;
  --k-class:#e4ebf2; --k-pdf:#fb923c; --k-test:#b794f6;
  --s0:#6b9bff; --s1:#f0a630; --s2:#ff6fa8; --s3:#3cc7e6; --s4:#9bd23c; --s5:#b38bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#151c23; --sunk:#10161c; --hover:#1b242d;
  --ink:#e4ebf2; --muted:#9aa8b6; --faint:#6f7d8b;
  --line:#25303a; --line-strong:#364350;
  --accent:#34c4ab; --accent-ink:#06201b; --accent-soft:#11302b; --accent-line:#1f6a5d;
  --danger:#ff8a7a; --danger-soft:#3a1915;
  --k-class:#e4ebf2; --k-pdf:#fb923c; --k-test:#b794f6;
  --s0:#6b9bff; --s1:#f0a630; --s2:#ff6fa8; --s3:#3cc7e6; --s4:#9bd23c; --s5:#b38bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.top-name{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.crumb{font-size:12px;color:var(--faint);letter-spacing:.02em}
.crumb b{color:var(--muted);font-weight:600}
#cname{border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin-left:-8px;font-size:20px;font-weight:700;letter-spacing:-.01em;width:100%;max-width:520px}
#cname:hover{border-color:var(--line)}
#cname:focus{border-color:var(--accent);outline:none;background:var(--surface)}
#cname::placeholder{color:var(--faint);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px;border-radius:5px}
.link:hover{text-decoration:underline}
.icon{border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon.del:hover{background:var(--danger-soft);color:var(--danger)}

.tabs{display:none}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(360px,42%) 1fr}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.lib{background:var(--surface);border-right:1px solid var(--line)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){.lib .pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}.cv .pad{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}}

.pane-head{padding-block:16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.005em}
.pane-head p{margin:0;color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:9px;padding:0 10px;background:var(--surface);color:var(--faint)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;outline:0;background:transparent;padding:9px 0;flex:1;min-width:0;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pane-body{flex:1;min-height:0;overflow:auto;padding-block:8px 16px}

/* course list */
.ccard{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-top:8px}
.ccard:hover{border-color:var(--line-strong);background:var(--hover)}
.ccard:hover .cgo{color:var(--accent);transform:translateX(2px)}
.cdot{width:10px;height:10px;border-radius:3px;background:var(--c);margin-top:5px;flex:none}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cname{font-weight:600;font-size:14.5px}
.cmeta{color:var(--muted);font-size:13px}
.ccount{color:var(--faint);font-size:12.5px;margin-top:2px}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.02em;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.pill.live{background:var(--danger-soft);color:var(--danger)}
.in-course{font-size:12px;color:var(--accent);font-weight:600}
.cgo{color:var(--faint);transition:transform .15s}

/* course header in tree view */
.back{align-self:flex-start;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px;padding:2px 6px 2px 2px;margin-left:-2px;border-radius:6px}
.back:hover{color:var(--ink);background:var(--sunk)}
.src-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.src-sub{color:var(--muted);font-size:13px;margin-top:-6px}
.tree-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--faint);margin-right:auto;display:flex;gap:6px;align-items:center}
.legend b{font-weight:600;color:var(--muted)}

/* tree rows */
.row{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 8px 4px calc(4px + var(--lv,0) * 22px);border-radius:8px;user-select:none}
.row:hover{background:var(--hover)}
.row[draggable="true"]{cursor:grab}
.lv-sec{font-weight:700;font-size:14px;margin-top:6px}
.lv-top{font-weight:600}
.lv-sub{color:var(--muted);font-weight:500;font-size:13.5px}
.lv-item{font-size:13.5px;cursor:pointer}
.lv-item.is-on{background:var(--accent-soft)}
.lv-item.is-added{cursor:default;color:var(--faint)}
.row:has(> .cb.done) > .rname{color:var(--muted)}
.chev{border:0;background:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none;padding:0}
.chev:hover{background:var(--sunk);color:var(--ink)}
.chev svg{transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev-space{width:22px;flex:none}
.rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lv-item .rname{cursor:inherit}
.rmeta{color:var(--faint);font-weight:500;display:flex;gap:10px;flex:none;font-size:12.5px}
.tag-added{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;flex:none}

.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.cb:hover{border-color:var(--accent)}
.cb::after{content:"";display:block}
.cb.on,.cb.mixed{background:var(--accent);border-color:var(--accent)}
.cb.on::after,.cb.done::after{width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.cb.mixed::after{width:8px;height:2px;background:var(--accent-ink);border-radius:1px}
.cb.done{background:transparent;border-color:transparent;cursor:default}
.cb.done::after{border-color:var(--faint)}

.cnt{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.kicon{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;background:var(--sunk)}
.k-class{color:var(--k-class)} .k-pdf{color:var(--k-pdf)} .k-test{color:var(--k-test)}
.is-added .kicon{opacity:.5}
.none{color:var(--muted);padding:24px 8px;text-align:center}

/* tray */
.tray{border-top:1px solid var(--line);background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 18px rgba(15,25,40,.05)}
.tray-empty{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.tray-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tray-sum b{font-size:14px}
.tray-sum .rmeta{margin-right:auto}
.tray-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tray-row label{font-size:13px;color:var(--muted);font-weight:600}
.tray-row select{flex:1 1 180px;min-width:0;border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;background:var(--surface)}
.dest{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.dest li{display:flex;gap:8px;align-items:center;min-width:0}
.dest li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dest em{font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;flex:none}
.dest em.new{background:var(--sunk);color:var(--muted)}
.dest em.join{background:var(--accent-soft);color:var(--accent)}

/* canvas */
.cv{background:var(--bg)}
.cv .pane-head{background:var(--bg);flex-direction:row;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px 16px}
.cv-sum{color:var(--muted);font-size:13px;margin-top:2px}
.sources{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sources .lbl{font-size:12px;color:var(--faint);margin-right:2px}
.srcchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:500;color:var(--muted)}
.srcchip:hover{border-color:var(--line-strong);color:var(--ink)}
.srcchip.on{border-color:var(--c);color:var(--ink);box-shadow:0 0 0 1px var(--c)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cv-body{flex:1;min-height:0;overflow:auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:12px}
.cv-body.drop-on{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}

.empty{flex:1;border:2px dashed var(--line-strong);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:14px;min-height:320px;transition:border-color .15s,background .15s}
.drop-on .empty{border-color:var(--accent);background:var(--accent-soft)}
.empty h3{margin:0;font-size:19px;letter-spacing:-.01em}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.skeleton{display:flex;flex-direction:column;gap:6px;width:min(260px,100%);margin-bottom:4px}
.skeleton i{display:block;height:10px;border-radius:5px;background:var(--line)}
.skeleton i:nth-child(1){width:48%;height:12px;background:var(--line-strong)}
.skeleton i:nth-child(2){width:70%;margin-left:16px}
.skeleton i:nth-child(3){width:60%;margin-left:16px}
.skeleton i:nth-child(4){width:42%;height:12px;background:var(--line-strong);margin-top:6px}
.skeleton i:nth-child(5){width:66%;margin-left:16px}
.steps{list-style:none;margin:4px 0 0;padding:0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.steps li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:500}
.steps b{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative;transition:border-color .15s,box-shadow .15s}
.sec-h{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 8px;border-bottom:1px solid transparent}
.sec.open .sec-h{border-bottom-color:var(--line)}
.sec-h h3{margin:0;font-size:15.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;letter-spacing:-.005em}
.grip{color:var(--faint);cursor:grab;width:18px;height:28px;display:grid;place-items:center;flex:none;opacity:.6}
.grip:hover{opacity:1}
.rename{flex:1;min-width:0;border:1px solid var(--accent);border-radius:7px;padding:4px 8px;font-weight:700;background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.sec-body{padding:6px 8px 10px}
.sec-empty{color:var(--faint);font-size:13px;padding:14px 12px;border:1.5px dashed var(--line);border-radius:10px;margin:4px 4px 0;text-align:center}
.drop-hint{display:none}
.lib-dragging .sec{border-style:dashed;border-color:var(--line-strong)}
.sec.drop-on{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px var(--accent-soft)}
.sec.drop-on .drop-hint{display:flex;position:absolute;inset:auto 12px -14px auto;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;z-index:2}

.top-h{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 2px;border-radius:9px;min-height:38px}
.top-h:hover{background:var(--hover)}
.top-h .tname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.top-h .acts,.sec-h .acts,.it .acts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.top-h:hover .acts,.top-h:focus-within .acts,.sec-h:hover .acts,.sec-h:focus-within .acts,.it:hover .acts,.it:focus-within .acts{opacity:1}
@media (hover:none){.top-h .acts,.sec-h .acts,.it .acts{opacity:1}}
.subs{padding:2px 0 8px 46px;display:flex;flex-direction:column;gap:6px}
.sub-h{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 0 2px}
.it{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;min-height:36px;font-size:13.5px}
.it:hover{background:var(--hover)}
.it .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .from{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--faint);flex:none;max-width:140px}
.it .from span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .mono{color:var(--faint);flex:none;width:64px;text-align:right}
.dim{opacity:.28}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.sec.drop-before{box-shadow:0 -3px 0 var(--accent),var(--shadow)}
.sec.drop-after{box-shadow:0 3px 0 var(--accent),var(--shadow)}

.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--danger-soft);border-radius:9px;padding:8px 10px;margin:6px 8px;font-size:13px}
.confirm span{flex:1 1 220px}
.add-sec{align-self:flex-start;border:1.5px dashed var(--line-strong);background:transparent;border-radius:10px;padding:9px 14px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.add-sec:hover{border-color:var(--accent);color:var(--accent)}
.focus-note{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* toast + dialog */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;z-index:30;width:max-content;max-width:calc(100% - 32px);font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:color-mix(in srgb,var(--surface) 18%,transparent);color:var(--surface);font-weight:700;border-radius:8px;padding:6px 12px}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);z-index:41;padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:18px;letter-spacing:-.01em}
.dlg p{margin:0;color:var(--muted)}
.dlg label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.dlg input{border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-weight:500;background:var(--surface)}
.dlg input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.facts b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
.note{font-size:13px;background:var(--accent-soft);color:var(--ink)!important;border-radius:10px;padding:10px 12px}
.dlg .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ok-mark{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

[hidden]{display:none!important}

function filterCourse(c,q){
  const m = s => s.toLowerCase().includes(q), out = [];
  for(const s of c.sections){
    if(m(s.name)){out.push(s);continue}
    const ts = [];
    for(const t of s.topics){
      if(m(t.name)){ts.push(t);continue}
      const bs = [];
      for(const b of t.subs){ if(m(b.name)){bs.push(b);continue} const its=b.items.filter(i=>m(i.title)); if(its.length) bs.push({...b,items:its}); }
      if(bs.length) ts.push({...t,subs:bs});
    }
    if(ts.length) out.push({...s,topics:ts});
  }
  return out;
}

  return secs.map(s=>nodeHTML(s,'sec',added,!!q)).join('');

function nodeHTML(node, lvl, added, forceOpen){

  const st = !free.length ? 'done' : !on ? 'off' : on===free.length ? 'on' : 'mixed';
  const open = forceOpen || ui.open.has(node.key);
  const addedN = ids.length - free.length, k = esc(node.key);
  let h = `<div class="row lv-${lvl}" style="--lv:${LV[lvl]}" ${free.length?'draggable="true"':''} data-drag-key="${k}">

function destinations(){

  const D = pg.details; if(D.seeded) return;
  const by = {}; for(const i of pgItems()) by[i.src] = (by[i.src]||0)+1;
  const srcs = Object.keys(by).sort((a,b)=>by[b]-by[a]).map(id=>COURSE[id]);
  const exams = {}; for(const c of srcs) exams[c.exam] = (exams[c.exam]||0)+by[c.id];
  D.exam = Object.keys(exams).sort((a,b)=>exams[b]-exams[a])[0] || '';
  D.live = srcs.some(c=>c.mode==='Live'); D.recorded = srcs.some(c=>c.mode==='Recorded');
  D.faculty = [...new Set(srcs.map(c=>c.faculty))];
  D.seeded = true;
}

/* Course Builder: a chapter is a topic of the outline; its price is the custom ₹ if set, else maximum × weight %. */
const chapters = () => pg.sections.flatMap(s=>s.topics.map(t=>({id:t.id,name:t.name,sec:s.name,classes:nodeItems(t).filter(i=>i.kind==='class').length})));
function chPrice(id){
  const P = pg.price, c = num(P.custom[id]); if(c!==null) return c;
  const w = num(P.weights[id]); return w===null ? null : (num(P.max)||0)*w/100;
}
const priced = () => chapters().filter(c=>num(pg.price.weights[c.id])!==null || num(pg.price.custom[c.id])!==null);
const weightTotal = () => Math.round(chapters().reduce((s,c)=>s+(num(pg.price.weights[c.id])||0),0)*100)/100;
function splitWeights(by){
  const ch = chapters(); if(!ch.length) return;
  const share = c => by==='even' ? 1 : Math.max(c.classes,1);
  const tot = ch.reduce((s,c)=>s+share(c),0), w = {};
  for(const c of ch) w[c.id] = Math.floor(share(c)/tot*1000)/10;
  const big = ch.reduce((a,b)=>w[a.id]>=w[b.id]?a:b);
  w[big.id] = round1(w[big.id] + 100 - Object.values(w).reduce((s,v)=>s+v,0));
  pg.price.weights = Object.fromEntries(Object.entries(w).map(([k,v])=>[k,String(v)]));
}
function seedWeights(){ if(!priced().length) splitWeights('classes'); }

const extraOn = k => k in ui.pv.on ? ui.pv.on[k] : pg.price[k].defaultOn;
// The checkout rule: chapters subtotal capped at the maximum selling price (which has every shown extra ticked),
// less each shown extra left unticked, raised to the minimum selling price.
function quote(){
  const P = pg.price, max = num(P.max), min = num(P.min)||0;
  if(max===null) return null;
  const ch = priced(), picks = ui.pv.picked ? ch.filter(c=>ui.pv.picked.has(c.id)) : ch;
  const lines = [], sub = Math.round(picks.reduce((s,c)=>s+(chPrice(c.id)||0),0)*100)/100;
  lines.push([`${picks.length} of ${ch.length} chapters`, sub]); let v = sub;
  if(sub>max+0.5){ lines.push(['Capped at the maximum selling price', max-sub]); v = max; }
  for(const [k,label] of EXTRAS) if(P[k].show && !extraOn(k)){
    const d = num(P[k].value)||0; if(d){ lines.push([`Without ${label}`, -d]); v -= d; }
  }
  const final = Math.round(Math.max(v,min)), mrp = num(P.bmrp);
  return {lines, final, atMin:v<min, struck: mrp && max ? Math.round(final*mrp/max) : null};
}
function priceSummary(){
  const P = pg.price, max = num(P.max), min = num(P.min);
  if(max===null) return {main:'Price not set', unset:true};
  const m = num(P.bmrp);
  return {main:`From ${rs(min??max)}`, sub:`Build your own · whole course ${rs(max)}${m&&m>max?` <s>${rs(m)}</s>`:''}`};
}
function validityText(){
  const V = pg.details.validity;
  if(V.kind==='date') return V.date ? `Till ${new Date(V.date+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}` : 'End date not set';
  return num(V.days) ? `${num(V.days)} days` : 'Validity not set';
}

/* [state, text, step to fix it]: block stops Create, warn does not. */
function checks(){
  const D = pg.details, P = pg.price, out = [], n = pgItems().length;
  out.push(n ? ['ok',`${n} items in ${pg.sections.length} section${pg.sections.length>1?'s':''}`,'content'] : ['block','Add content first','content']);
  out.push(pg.name.trim() ? ['ok','The course has a title','details'] : ['block','Give the course a title','details']);
  out.push(D.faculty.length ? ['ok',`Faculty: ${D.faculty.join(', ')}`,'details'] : ['warn','No faculty listed','details']);
  if(D.validity.kind==='date' ? !D.validity.date : !num(D.validity.days)) out.push(['block','Set the validity','details']);
  out.push(D.banner ? ['ok','App banner added','details'] : ['warn','No app banner yet; the app shows a plain placeholder','details']);
  const max = num(P.max), min = num(P.min), t = weightTotal(), unsold = chapters().length - priced().length;
  if(!(max>0)) out.push(['block','Set the maximum selling price','price']);
  if(!(min>0)) out.push(['block','Set the minimum selling price','price']);
  if(max>0 && min>0 && min>max) out.push(['block','The minimum selling price is above the maximum','price']);
  if(Math.abs(t-100)>0.01) out.push(['block',`Chapter weights add up to ${t}%, not 100%`,'price']);
  if(unsold) out.push(['warn',`${unsold} chapter${unsold>1?'s have':' has'} no weight and won't be sold`,'price']);
  for(const [k,label] of EXTRAS) if(P[k].show && num(P[k].value)===null) out.push(['warn',`${label} is shown in the app with no price`,'price']);
  if(!out.some(c=>c[0]==='block'&&c[2]==='price')) out.push(['ok',`Selling price ${rs(min)} to ${rs(max)}`,'price']);
  return out;
}
const blockers = () => checks().filter(c=>c[0]==='block');
const stepOk = step => !checks().some(c=>c[0]==='block'&&c[2]===step);

function go(step){
  if(step!=='content' && !pgItems().length) return;
  if(step==='details') seedDetails();
  if(step==='price') seedWeights();
  pg.step = step; ui.renaming = null;
  renderAll(true);
  document.getElementById('form').scrollTop = 0;
}
function renderStepper(){
  const has = pgItems().length, i = STEPS.findIndex(s=>s[0]===pg.step);
  document.getElementById('stepper').innerHTML = STEPS.map(([k,l],j)=>{
    const done = j<i && stepOk(k);
    return `${j?'<span class="sep"></span>':''}<button class="${k===pg.step?'on':done?'ok':''}" data-a="go" data-v="${k}" ${k!=='content'&&!has?'disabled':''} aria-current="${k===pg.step?'step':'false'}"><span class="n">${done?'✓':j+1}</span><span class="lb">${l}</span></button>`;
  }).join('');
  const btn = document.getElementById('nextBtn'), next = STEPS[i+1];
  btn.dataset.a = next ? 'go' : 'finish'; btn.dataset.v = next ? next[0] : '';
  btn.innerHTML = next ? `Next: ${next[1]} ${I.arrow}` : 'Create course';
  btn.disabled = !has || (!next && blockers().length>0);
}
function renderForm(){
  const s = pg.step;
  document.getElementById('form').innerHTML = `<div class="form-wrap pad">
    <div class="form-main">${s==='details'?detailsHTML():s==='price'?priceHTML():reviewHTML()}${footHTML()}</div>
    <aside class="form-side" id="side">${sideHTML()}</aside></div>`;
}
function footHTML(){
  const i = STEPS.findIndex(s=>s[0]===pg.step), prev = STEPS[i-1], next = STEPS[i+1];

           : `<button class="btn primary" data-a="finish" ${blockers().length?'disabled':''}>Create course</button>`}</div>`;

// Updates the computed parts of a form step without touching the field being typed in.
function refresh(){
  const side = document.getElementById('side'); if(side) side.innerHTML = sideHTML();

  <section class="fcard"><div class="rv-h"><h3>Price</h3><button class="link" data-a="go" data-v="price">Edit</button></div><dl class="kv">${priceRows}</dl></section>
  <section class="fcard"><h3>When it is created</h3>
    <label class="radio-opt${pg.status==='inactive'?' on':''}"><input type="radio" name="st" value="inactive" data-st ${pg.status==='inactive'?'checked':''}><span><b>Keep it off sale</b><span>Inactive. Check it in the app first, then switch it on from the course list.</span></span></label>
    <label class="radio-opt${pg.status==='active'?' on':''}"><input type="radio" name="st" value="active" data-st ${pg.status==='active'?'checked':''}><span><b>Put it on sale now</b><span>Active. Students can find and buy it straight away.</span></span></label>
    <p class="note" style="margin:0">Classes, PDFs and tests are shared with the courses they came from. Nothing is moved, and buyers of those courses keep their access.</p>
  </section>`;
}
// Keeps a picked banner small enough for browser storage.
function readBanner(file){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const w = Math.min(960, img.width), cv = document.createElement('canvas');
    cv.width = w; cv.height = Math.round(img.height*w/img.width);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    pg.details.banner = cv.toDataURL('image/jpeg',0.8); renderForm(); refresh();
  }; img.src = r.result; };
  r.readAsDataURL(file);
}

/* ---------- actions ---------- */
let toastTimer;
function toast(msg, undo){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span>${undo?'<button data-a="undo">Undo</button>':''}`;
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 6000);
}
function snapshot(){ ui.undo = JSON.stringify(pg); }
function addItems(ids, place, courseId){
  const L = LOOK[courseId], added = addedSet(), target = place!=='keep' ? findSec(place) : null;
  const before = JSON.stringify(pg), touched = new Set(); let n = 0;
  ui.flash = new Set();
  for(const id of ids){
    if(added.has(id) || !L[id]) continue;
    const p = L[id];
    let s = target || secByName(p.section);
    if(!s){ s = {id:nid('s'),name:p.section,aliases:[norm(p.section)],topics:[]}; pg.sections.push(s); }
    let t = s.topics.find(x=>norm(x.name)===norm(p.topic));
    if(!t){ t = {id:nid('t'),name:p.topic,subs:[]}; s.topics.push(t); }
    let b = t.subs.find(x=>norm(x.name)===norm(p.sub));
    if(!b){ b = {id:nid('b'),name:p.sub,items:[]}; t.subs.push(b); }
    b.items.push({...p.item,src:courseId});
    added.add(id); n++; ui.closedSec.delete(s.id); ui.openTopic.add(t.id); ui.flash.add(id); touched.add(s.name);
  }
  if(!n) return;
  ui.undo = before; ids.forEach(i=>ui.sel.delete(i));
  const names = [...touched];
  const where = names.slice(0,2).map(x=>`“${esc(x)}”`).join(' and ') + (names.length>2?` +${names.length-2} more`:'');
  toast(`Added ${n} item${n>1?'s':''} to ${where}`, true);
  renderAll();
  setTimeout(()=>ui.flash.clear(), 50);
}
function prune(){
  for(const s of pg.sections){ for(const t of s.topics) t.subs = t.subs.filter(b=>b.items.length); s.topics = s.topics.filter(t=>t.subs.length); }
}
// Swaps the input back to a label in place: re-rendering here would replace the button the user is clicking.
function commitRename(input, keep){
  if(!input || !input.isConnected || !ui.renaming || ui.renaming.id!==input.dataset.id) return;
  const v = input.value.trim(), {type,id} = ui.renaming;
  ui.renaming = null;
  const node = type==='sec' ? findSec(id) : findTop(id)?.t; if(!node) return;
  if(keep && v){ if(type==='sec') node.aliases = [...new Set([...(node.aliases||[]), norm(node.name)])]; node.name = v; const o=document.querySelector(`#place option[value="${id}"]`); if(o) o.textContent=v; }
  input.closest('[draggable]')?.setAttribute('draggable','true');
  input.outerHTML = nameHTML(type, node, type==='sec'?'':'tname', type==='sec'?'h3':'span');
  save();
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, d = el.dataset;
  switch(a){
    case 'open': {
      ui.view='course'; ui.courseId=d.id; ui.q=''; ui.sel.clear(); ui.place='keep';
      ui.open = new Set(COURSE[d.id].sections.map(s=>s.key));
      renderLib(); break; }
    case 'back': ui.view='list'; ui.sel.clear(); renderLib(); break;
    case 'exam': ui.exam=d.v; renderLib(); break;
    case 'toggle': ui.open.has(d.key) ? ui.open.delete(d.key) : ui.open.add(d.key); renderLibBody(); break;
    case 'tick': {
      const node = VIS[d.key]; if(!node) break;
      const added = addedSet(), free = leaves(node).filter(i=>!added.has(i));
      const all = free.every(i=>ui.sel.has(i));
      free.forEach(i=> all ? ui.sel.delete(i) : ui.sel.add(i));
      renderLibBody(); break; }
    case 'tickItem': ui.sel.has(d.id) ? ui.sel.delete(d.id) : ui.sel.add(d.id); renderLibBody(); break;
    case 'expandAll': {
      const c = COURSE[ui.courseId];
      const keys = c.sections.flatMap(s=>[s.key,...s.topics.flatMap(t=>[t.key,...t.subs.map(b=>b.key)])]);
      ui.open = keys.every(k=>ui.open.has(k)) ? new Set(c.sections.map(s=>s.key)) : new Set(keys);
      renderLibBody(); break; }
    case 'tickAll': {
      const added = addedSet(), free = leaves(COURSE[ui.courseId]).filter(i=>!added.has(i));
      const all = free.every(i=>ui.sel.has(i)); free.forEach(i=> all ? ui.sel.delete(i) : ui.sel.add(i));
      renderLibBody(); break; }
    case 'clear': ui.sel.clear(); renderLibBody(); break;
    case 'add': addItems([...ui.sel], ui.place, ui.courseId); break;
    case 'secToggle': ui.closedSec.has(d.id) ? ui.closedSec.delete(d.id) : ui.closedSec.add(d.id); renderCanvas(); break;
    case 'topToggle': if(ui.renaming) break; ui.openTopic.has(d.id) ? ui.openTopic.delete(d.id) : ui.openTopic.add(d.id); renderCanvas(); break;
    case 'rename': ui.renaming={type:d.type,id:d.id}; ui.confirm=null; renderCanvas(); break;
    case 'askRemove': ui.confirm={type:d.type,id:d.id}; renderCanvas(); break;
    case 'cancelRemove': ui.confirm=null; renderCanvas(); break;
    case 'doRemove': {
      const {type,id} = ui.confirm; snapshot(); let name='';
      if(type==='sec'){ const s=findSec(id); name=s.name; pg.sections=pg.sections.filter(x=>x.id!==id); }
      else { const f=findTop(id); name=f.t.name; f.s.topics=f.s.topics.filter(x=>x.id!==id); }
      ui.confirm=null; toast(`Removed “${esc(name)}”`, true); renderAll(); break; }
    case 'removeItem': {
      const f = findSub(d.sub); if(!f) break; snapshot();
      const it = f.b.items.find(i=>i.id===d.id);
      f.b.items = f.b.items.filter(i=>i.id!==d.id); prune();
      toast(`Removed “${esc(it.title)}”`, true); renderAll(); break; }
    case 'newSec': {
      const s = {id:nid('s'),name:'New section',topics:[]}; pg.sections.push(s);
      ui.renaming={type:'sec',id:s.id}; renderAll(); break; }
    case 'focus': ui.focus = ui.focus===d.id ? null : d.id; renderCanvas(); break;
    case 'undo':
      if(ui.undo){ pg = JSON.parse(ui.undo); ui.undo=null; ui.renaming=null; ui.confirm=null; renderAll(); toast('Undone'); }
      break;
    case 'tab': ui.tab=d.v; renderTop(); break;
    case 'reset': ui.modal='reset'; renderModal(); break;
    case 'closeModal': ui.modal=null; renderModal(); break;
    case 'go': go(d.v); break;
    case 'finish': if(blockers().length){ go('review'); break; } ui.modal='done'; renderModal(); break;
    case 'setExam': pg.details.exam = pg.details.exam===d.v ? '' : d.v; renderForm(); refresh(); break;
    case 'setVal': pg.details.validity.kind=d.v; renderForm(); refresh(); break;
    case 'facUp': { const f=pg.details.faculty, i=+d.i; [f[i-1],f[i]]=[f[i],f[i-1]]; renderForm(); refresh(); break; }
    case 'facDel': pg.details.faculty.splice(+d.i,1); renderForm(); refresh(); break;
    case 'bannerDel': pg.details.banner=null; renderForm(); refresh(); break;
    case 'split': splitWeights(d.v); renderForm(); refresh(); break;
    case 'pvPick': {
      if(!ui.pv.picked) ui.pv.picked = new Set(priced().map(c=>c.id));
      ui.pv.picked.has(d.id) ? ui.pv.picked.delete(d.id) : ui.pv.picked.add(d.id);
      document.getElementById('side').innerHTML = sideHTML(); break; }
    case 'confirmReset':
      snapshot(); pg={name:'',sections:[]}; shape(); ui.pv.picked=null; document.getElementById('cname').value='';
      ui.modal=null; ui.focus=null; ui.closedSec.clear(); ui.openTopic.clear(); renderAll(true); toast('Course emptied', true); break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='cq'){ ui.cq=e.target.value; renderLibBody(); }
  else if(e.target.id==='q'){ ui.q=e.target.value; renderLibBody(); }
  else if(e.target.id==='cname'){ pg.name=e.target.value; const f=document.getElementById('f-name'); if(f) f.value=pg.name; if(pg.step!=='content') refresh(); else save(); }
  else if(e.target.dataset.f && e.target.type!=='checkbox'){
    setPath(e.target.dataset.f, e.target.value);
    if(e.target.dataset.f==='name') document.getElementById('cname').value = pg.name;
    refresh();
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.f && t.type==='checkbox'){ setPath(t.dataset.f, t.checked); if(t.dataset.rerender!==undefined) renderForm(); refresh(); return; }
  if(t.dataset.pv){ ui.pv.on[t.dataset.pv] = t.checked; document.getElementById('side').innerHTML = sideHTML(); return; }
  if(t.dataset.st!==undefined){ pg.status = t.value; renderForm(); refresh(); return; }
  if(t.id==='facAdd' && t.value){ pg.details.faculty.push(t.value); renderForm(); refresh(); return; }
  if(t.id==='f-banner' && t.files[0]){ readBanner(t.files[0]); return; }
  if(t.id!=='place') return;
  if(e.target.value==='__new'){
    const s = {id:nid('s'),name:'New section',topics:[]}; pg.sections.push(s);
    ui.place = s.id; ui.renaming = {type:'sec',id:s.id};
    if(matchMedia('(max-width:860px)').matches){ ui.renaming=null; s.name=`New section ${pg.sections.length}`; }
    renderAll();
  } else { ui.place = e.target.value; renderTray(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id==='rn'){ if(e.key==='Enter') commitRename(e.target,true); if(e.key==='Escape') commitRename(e.target,false); return; }
  if(e.key==='Escape' && ui.modal){ ui.modal=null; renderModal(); }
  if((e.key==='Enter'||e.key===' ') && e.target.dataset?.a==='pvPick'){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('focusout', e=>{ if(e.target.id==='rn') commitRename(e.target,true); });

/* ---------- drag and drop ---------- */
let drag = null;
const clearMarks = () => document.querySelectorAll('.drop-on,.drop-before,.drop-after').forEach(n=>n.classList.remove('drop-on','drop-before','drop-after'));
document.addEventListener('dragstart', e=>{
  const r = e.target.closest?.('[data-drag-key],[data-drag-item],[data-dragsec],[data-dragtop],[data-dragit]');
  if(!r || r.getAttribute('draggable')!=='true'){ return; }
  if(r.dataset.dragKey!==undefined || r.dataset.dragItem!==undefined){
    const added = addedSet();
    const own = r.dataset.dragItem!==undefined ? [r.dataset.dragItem] : leaves(VIS[r.dataset.dragKey]).filter(i=>!added.has(i));
    const ids = own.some(i=>ui.sel.has(i)) ? [...ui.sel] : own;
    drag = {from:'lib',ids,courseId:ui.courseId};
    e.dataTransfer.effectAllowed = 'copy';
    document.getElementById('cv').classList.add('lib-dragging');
  } else {
    const type = r.dataset.dragsec ? 'sec' : r.dataset.dragtop ? 'top' : 'it';
    drag = {from:'cv',type,id:r.dataset.dragsec||r.dataset.dragtop||r.dataset.dragit,parent:r.dataset.parent||null};
    e.dataTransfer.effectAllowed = 'move';
  }
  e.dataTransfer.setData('text/plain', drag.from);
});
function cvTarget(e){
  if(drag.type==='sec'){ const s=e.target.closest('[data-sec]'); return s && s.dataset.sec!==drag.id ? s : null; }
  const sel = drag.type==='top' ? '[data-dragtop]' : '[data-dragit]';
  const r = e.target.closest(sel);
  if(!r || r.dataset.parent!==drag.parent) return null;
  if((r.dataset.dragtop||r.dataset.dragit)===drag.id) return null;
  return r;
}
document.addEventListener('dragover', e=>{
  if(!drag) return;
  if(drag.from==='lib'){
    const t = e.target.closest('#cv [data-drop]'); clearMarks();
    if(t){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; t.classList.add('drop-on'); }
    return;
  }
  const t = cvTarget(e); clearMarks();
  if(!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const box = t.getBoundingClientRect();
  t.classList.add(e.clientY > box.top + box.height/2 ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e=>{
  if(!drag) return;
  e.preventDefault();
  if(drag.from==='lib'){
    const t = e.target.closest('#cv [data-drop]');
    if(t){ const place = t.dataset.drop; addItems(drag.ids, place, drag.courseId); }
  } else {
    const t = cvTarget(e);
    if(t){
      const after = t.classList.contains('drop-after');
      const toId = t.dataset.sec || t.dataset.dragtop || t.dataset.dragit;
      const arr = drag.type==='sec' ? pg.sections : drag.type==='top' ? findSec(drag.parent).topics : findSub(drag.parent).b.items;
      const i = arr.findIndex(x=>x.id===drag.id); const [m] = arr.splice(i,1);
      let j = arr.findIndex(x=>x.id===toId); if(after) j++; arr.splice(j,0,m);
      renderAll();
    }
  }
  clearMarks();
});
document.addEventListener('dragend', ()=>{ drag=null; clearMarks(); document.getElementById('cv').classList.remove('lib-dragging'); });

/* ---------- boot ---------- */
shape();
document.getElementById('cname').value = pg.name || '';
renderAll(true);
</script>
